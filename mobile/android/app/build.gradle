apply plugin: 'com.android.application'

// This separate TEST lineage must never fall back to a runner-generated key.
def previewSigningValues = [
    'MIR_PREVIEW_KEYSTORE_PATH', 'MIR_PREVIEW_KEYSTORE_PASSWORD',
    'MIR_PREVIEW_KEY_ALIAS', 'MIR_PREVIEW_KEY_PASSWORD', 'MIR_PREVIEW_CERT_SHA256'
].collectEntries { name -> [(name): System.getenv(name)] }
if (previewSigningValues.values().any { value -> value == null || value.isEmpty() }
        || !file(previewSigningValues['MIR_PREVIEW_KEYSTORE_PATH']).isFile()) {
    throw new GradleException('MIR TEST Aperçu exige sa signature durable configurée ; aucune clé debug de remplacement.')
}

android {
    namespace = "ca.revetementsmir.equipe.test"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ca.revetementsmir.equipe.test.preview"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv('MIR_ANDROID_VERSION_CODE') ?: '130005')
        versionName "0.13.3-test"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        preview {
            storeFile file(previewSigningValues['MIR_PREVIEW_KEYSTORE_PATH'])
            storeType 'PKCS12'
            storePassword previewSigningValues['MIR_PREVIEW_KEYSTORE_PASSWORD']
            keyAlias previewSigningValues['MIR_PREVIEW_KEY_ALIAS']
            keyPassword previewSigningValues['MIR_PREVIEW_KEY_PASSWORD']
            enableV1Signing true
            enableV2Signing true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.preview
        }
        release {
            signingConfig signingConfigs.preview
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // Align the Kotlin standard libraries pulled by the pinned native plugins.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    androidTestImplementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// No Firebase, Google Services or notification transport in the private TEST app.
