</text><text x="430" y="880" font-size="13">QA : conserver la note française et chaque</text><text x="430" y="898" font-size="13">détail de fabrication. Repère QA :</text><text x="430" y="916" font-size="13">conserver</text><text x="430" y="934" font-size="13">la note française et chaque détail de</text><text x="430" y="952" font-size="13">fabrication. Repère QA : conserver la note</text></g></svg>