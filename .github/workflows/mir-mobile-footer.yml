name: MIR — Pied de page mobile TEST
on:
  push:
    branches: [codex/pliage-harmonie-20261117]
    paths:
      - 'dist/mir-prestige.css'
      - 'dist/mir-client-pliage.css'
      - 'tests/mir-mobile-footer-browser.cjs'
      - '.github/workflows/mir-mobile-footer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-footer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Clear previous generated footer evidence
        run: rm -rf docs/verification/pliage-harmonie-20261117/mobile-footer-qa
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
          node -e 'const fs=require("fs"),{chromium}=require("playwright");fs.appendFileSync(process.env.GITHUB_ENV,"MIR_CHROMIUM_BIN="+chromium.executablePath()+"\n")'
      - name: Build isolated TEST preview
        run: node scripts/build-prestige-preview.cjs
      - name: Compare mobile footer and preserve larger layouts
        run: node tests/mir-mobile-footer-browser.cjs
      - name: Save current footer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mir-mobile-footer-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: docs/verification/pliage-harmonie-20261117/mobile-footer-qa/
