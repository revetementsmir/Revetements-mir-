name: MIR dossier chantier central

on:
  pull_request:
    paths:
      - 'dist/chantier-app.js'
      - 'dist/chantier.css'
      - 'dist/portal-client.js'
      - 'supabase/migrations/20261111120000_job_dossier_central.sql'
      - 'tests/mir-job-dossier-*.cjs'
      - '.github/workflows/mir-job-dossier-pr.yml'

permissions:
  contents: read

jobs:
  dossier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix tools/database --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
      - run: node --check dist/chantier-app.js && node --check dist/portal-client.js
      - run: node tests/mir-job-dossier-postgres.cjs
      - run: node --test tests/mir-job-dossier-real.cjs
      - run: MIR_CHROMIUM_BIN=$(command -v google-chrome || command -v chromium) node tests/mir-job-dossier-browser.cjs
