name: MIR chat Phase 3A real TEST
on:
  pull_request:
    paths:
      - 'tools/validation/mir-chat-phase3a-real.py'
      - 'tools/validation/mir-chat-files-real.py'
      - '.github/workflows/mir-chat-phase3a-real.yml'
      - 'supabase/migrations/*chat_phase3a*'
      - 'supabase/proposals/*chat_phase3a*'
      - 'supabase/functions/mir-chat-files/**'
      - 'supabase/functions/_shared/chat-file*.mjs'
  workflow_dispatch:
    inputs:
      certify_gateway:
        description: 'Seulement après autorisation et activation TEST de la passerelle (aucun déploiement par ce workflow)'
        type: boolean
        default: false
      wait_natural_expiry:
        description: 'Attendre réellement l’expiration JWT courante sans modifier sa durée globale'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mir-chat-phase3a-real-test
  cancel-in-progress: false
jobs:
  real-test:
    if: github.head_ref == 'codex/phase-3a-clavardage-securite' || github.ref_name == 'codex/phase-3a-clavardage-securite'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MIR_CHAT_WORK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MIR_CHAT_REAL_REPORT: artifacts/mir-chat-phase3a-real.json
      # PR #4 executes this once to obtain the real hosted proof. Revert to the
      # manual input after the evidence is recorded, so ordinary pushes stay fast.
      MIR_CHAT_WAIT_NATURAL_EXPIRY: ${{ github.event_name == 'pull_request' || inputs.wait_natural_expiry || 'false' }}
      MIR_SANDBOX_PUBLISHABLE_KEY: ${{ secrets.MIR_SANDBOX_PUBLISHABLE_KEY }}
      MIR_SANDBOX_ADMIN_EMAIL: ${{ secrets.MIR_SANDBOX_ADMIN_EMAIL }}
      MIR_SANDBOX_ADMIN_PASSWORD: ${{ secrets.MIR_SANDBOX_ADMIN_PASSWORD }}
      MIR_SANDBOX_BOSS_EMAIL: ${{ secrets.MIR_SANDBOX_BOSS_EMAIL }}
      MIR_SANDBOX_BOSS_PASSWORD: ${{ secrets.MIR_SANDBOX_BOSS_PASSWORD }}
      MIR_SANDBOX_CHEF_EMAIL: ${{ secrets.MIR_SANDBOX_CHEF_EMAIL }}
      MIR_SANDBOX_CHEF_PASSWORD: ${{ secrets.MIR_SANDBOX_CHEF_PASSWORD }}
      MIR_SANDBOX_EMPLOYEE_EMAIL: ${{ secrets.MIR_SANDBOX_EMPLOYEE_EMAIL }}
      MIR_SANDBOX_EMPLOYEE_PASSWORD: ${{ secrets.MIR_SANDBOX_EMPLOYEE_PASSWORD }}
      MIR_SANDBOX_ASSISTANT_EMAIL: ${{ secrets.MIR_SANDBOX_ASSISTANT_EMAIL }}
      MIR_SANDBOX_ASSISTANT_PASSWORD: ${{ secrets.MIR_SANDBOX_ASSISTANT_PASSWORD }}
      MIR_SANDBOX_WAREHOUSE_EMAIL: ${{ secrets.MIR_SANDBOX_WAREHOUSE_EMAIL }}
      MIR_SANDBOX_WAREHOUSE_PASSWORD: ${{ secrets.MIR_SANDBOX_WAREHOUSE_PASSWORD }}
      # Existing tenant-B internal account and an ALREADY authorized conversation.
      # Missing secrets are reported as blocked, never as tenant-B certification.
      MIR_CHAT_TENANT_B_INTERNAL_EMAIL: ${{ secrets.MIR_CHAT_TENANT_B_INTERNAL_EMAIL }}
      MIR_CHAT_TENANT_B_INTERNAL_PASSWORD: ${{ secrets.MIR_CHAT_TENANT_B_INTERNAL_PASSWORD }}
      MIR_CHAT_TENANT_B_CONVERSATION_ID: ${{ secrets.MIR_CHAT_TENANT_B_CONVERSATION_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Recette HTTPS réelle — comptes existants, TEST épinglé
        run: python3 tools/validation/mir-chat-phase3a-real.py
      - name: Nouvelle passerelle — certification explicite, refus si prérequis manquants
        if: always() && (github.event_name == 'pull_request' || inputs.certify_gateway)
        env:
          MIR_CHAT_REAL_REPORT: artifacts/mir-chat-files-real.json
        run: python3 tools/validation/mir-chat-files-real.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mir-chat-phase3a-real
          path: |
            artifacts/mir-chat-phase3a-real.json
            artifacts/mir-chat-files-real.json
          if-no-files-found: error
          retention-days: 14
