name: MIR — ateliers fixes téléphone tablette PC
on:
  pull_request:
    paths: ['dist/**', 'tests/**', '.github/workflows/mir-fixed-workspace-pr.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les modules et moteurs conservés
        run: |
          node --check dist/mir-workspace.js
          node --check dist/production-app.js
          node --check dist/calepinage-app.js
          node tests/mir-panel-dimensions.cjs
          node tests/mir-panel-one-sheet.cjs
          node tests/mir-po-workflow.cjs
      - run: npm install --no-save playwright@1.62.1
      - name: Recette Chrome réelle et régressions
        run: |
          export MIR_CHROMIUM_BIN=$(command -v google-chrome || command -v chromium)
          python3 -m http.server 8870 --bind 127.0.0.1 --directory dist >/tmp/mir-fixed-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/mir-fixed-workspace-browser.cjs
          node tests/mir-workspace-viewport-browser.cjs
          node tests/mir-atelier-v4-browser.cjs
          node tests/mir-admin-guided-browser.cjs
          node tests/mir-mobile-adjointe-browser.cjs
          node tests/mir-wall-section-trace-browser.cjs
          node tests/mir-panel-individual-browser.cjs
          node tests/mir-wall-panel-po-browser.cjs
          node tests/mir-panel-one-sheet-browser.cjs
          node tests/mir-calepinage-metric-browser.cjs
          node tests/mir-continue-combinations-browser.cjs
          node tests/mir-drawing-pan-browser.cjs
          node tests/mir-retours-cotes-browser.cjs
          node tests/mir-direct-po-browser.cjs
          node tests/mir-purchase-orders-browser.cjs
      - name: Preuves de recette
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MIR-ateliers-fixes
          path: |
            artifacts/fixed-workspace/
            artifacts/*10-panneaux*.pdf
            artifacts/mir-panel-wall-*.png
          if-no-files-found: warn
