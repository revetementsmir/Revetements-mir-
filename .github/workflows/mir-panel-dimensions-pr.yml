name: MIR — Panneaux architecturaux et cotes po/mm
on:
  push:
    branches: [moon/mir-calepinage-cotes-panneau-20261107]
  pull_request:
    branches: [main]
    paths:
      - 'dist/calepinage*'
      - 'dist/mir-panel-dimensions.js'
      - 'tests/mir-panel-dimensions.cjs'
      - 'tests/mir-panel-individual-browser.cjs'
      - '.github/workflows/mir-panel-dimensions-pr.yml'
permissions:
  contents: read
jobs:
  measurements:
    name: Cotes, fermeture, 2D et 3D
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests and source parsing
        run: |
          node --check dist/calepinage-app.js
          node --check dist/mir-panel-dimensions.js
          node --check tests/mir-panel-individual-browser.cjs
          node tests/mir-panel-dimensions.cjs
      - name: Chromium PC / iPad / phone
        run: |
          npm install --no-save playwright@1.58.2
          node tests/mir-panel-individual-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mir-panel-individual-chrome
          path: artifacts/mir-panel-individual-*.png
          if-no-files-found: ignore
