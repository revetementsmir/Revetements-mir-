name: MIR — Boutique client approuvée
on:
  pull_request:
    branches: [main]
    paths: ['dist/boutique.html','dist/produit.html','dist/selection.html','dist/commerce.js','dist/mir-commerce-approved.css','dist/mir-harmony.js','tests/mir-client-commerce-approved-browser.cjs','tests/mir-selection-pdf*','tests/mir-unified-dossier-browser.cjs','tests/mir-client-header*','tests/mir-account-browser.cjs','.github/workflows/mir-client-commerce-approved-pr.yml']
permissions:
  contents: read
jobs:
  client-commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npm install --no-save playwright@1.58.2
      - name: Conserver le main de référence pour comparer l’accueil
        env:
          MIR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p /tmp/mir-commerce-baseline
          git archive "$MIR_BASE_SHA" dist | tar -x -C /tmp/mir-commerce-baseline
      - name: Contrats et périmètre préservé
        run: |
          node --check dist/commerce.js
          node --check dist/mir-harmony.js
          node tests/mir-client-header.cjs
          node tests/mir-selection-pdf.cjs
          node tests/mir-homepage.cjs
          node tests/mir-new-materials.cjs
      - name: Recette native et régressions
        env:
          MIR_COMMERCE_BASELINE_DIR: /tmp/mir-commerce-baseline/dist
        run: |
          export MIR_CHROMIUM_BIN=$(command -v google-chrome || command -v chromium)
          node tests/mir-client-commerce-approved-browser.cjs
          node tests/mir-selection-pdf-browser.cjs
          node tests/mir-unified-dossier-browser.cjs
          node tests/mir-client-header-browser.cjs
          node tests/mir-production-client-flow-browser.cjs
          node tests/mir-account-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MIR-boutique-client-approved
          path: docs/verification/client-boutique/
