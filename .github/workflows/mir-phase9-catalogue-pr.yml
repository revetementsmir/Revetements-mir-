name: MIR Phase 9 — Catalogue et accessoires

on:
  pull_request:
    paths:
      - 'dist/catalogue-fd6866b49d21.json'
      - 'dist/mir-catalogue-policy.js'
      - 'dist/*catalogue*'
      - 'dist/commerce.js'
      - 'dist/employee-store-model.js'
      - 'dist/chantier*'
      - 'dist/production*'
      - 'dist/pliage*'
      - 'dist/plan*'
      - 'dist/entrepot*'
      - 'dist/metres.html'
      - 'tests/mir-phase9-catalogue*'
      - '.github/workflows/mir-phase9-catalogue-pr.yml'

permissions:
  contents: read

jobs:
  phase9-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
      - name: Contrats catalogue, variantes et instantanés
        run: |
          node --test tests/mir-phase9-catalogue.cjs
          node tests/mir-magasin-merge.cjs
          node tests/mir-boutique-audit-20261110.cjs
      - name: Responsive, thèmes et absence d’erreur JavaScript
        env:
          MIR_CHROMIUM_BIN: /usr/bin/google-chrome
        run: node tests/mir-phase9-catalogue-browser.cjs
      - name: Non-régressions Phases 6 à 8
        run: |
          node tests/mir-phase8-settings-client.cjs
          node tests/mir-phase7-notifications.cjs
          node tests/mir-ux-commandes-client-server-contract.cjs
          node tests/mir-pliage-audit-commercial.cjs
          node tests/mir-today.cjs
      - name: Contrôles de livraison stricts
        run: |
          git diff --check
          ! rg -n '\.(skip|only|todo)\s*\(' tests/mir-phase9-catalogue*.cjs
          ! rg -n 'continue-on-error:\s*true' .github/workflows/mir-phase9-catalogue-pr.yml
