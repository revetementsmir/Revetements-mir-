name: MIR Phase 10 — modèles, cotation et PDF
on:
  pull_request:
    paths: ['dist/production*', 'dist/mir-bending*', 'tests/mir-phase10*', 'tests/mir-technical-dimensions.cjs', '.github/workflows/mir-phase10-bending-pr.yml']
permissions:
  contents: read
jobs:
  phase10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Contrats et géométrie
        run: |
          node tests/mir-phase10-bending.cjs
          node tests/mir-phase10-management.cjs
          node tests/mir-technical-dimensions.cjs
          node tests/mir-pages-regressions.cjs
          git diff --check
      - name: Navigateur, intersections, sept formats et PDF réels
        env:
          MIR_CHROMIUM_BIN: /usr/bin/google-chrome
        run: |
          node tests/mir-phase10-bending-browser.cjs
          node tests/mir-phase10-label-layout-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase10-cotation-et-pdf
          path: docs/verification/phase10-bending/
