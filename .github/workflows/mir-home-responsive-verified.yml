name: MIR — Accueil responsive approuvé
on:
  push:
    branches: [codex/home-responsive-tested-20261117]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-responsive-verified-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser dependencies, isolated from application
        run: |
          npm install --prefix "$RUNNER_TEMP/mir-qa" --no-package-lock playwright@1.58.2 pngjs@7.0.0
          echo "NODE_PATH=$RUNNER_TEMP/mir-qa/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/mir-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build exact baseline and current TEST candidate
        run: |
          git worktree add --detach "$RUNNER_TEMP/mir-home-baseline" 3a3f646fdca0167563b425e3d51099654f4894f8
          (cd "$RUNNER_TEMP/mir-home-baseline" && node scripts/build-prestige-preview.cjs)
          node scripts/build-prestige-preview.cjs
      - name: Assert fit, labels, routes, orientation and unchanged desktop pixels
        run: node tests/mir-home-approved.cjs .prestige-preview "$RUNNER_TEMP/mir-home-baseline/.prestige-preview" home-approved-evidence
      - name: Record source
        if: always()
        run: |
          mkdir -p home-approved-evidence
          git rev-parse HEAD > home-approved-evidence/source-sha.txt
          sha256sum dist/index.html dist/mir-home-approved.css dist/mir-home-approved.js tests/mir-home-approved.cjs > home-approved-evidence/files.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mir-home-approved-${{ github.sha }}
          path: home-approved-evidence/
          retention-days: 30
