name: MIR shared database foundation
on:
  pull_request:
    paths: ['supabase/**', 'tools/database/**', 'tools/validation/**', 'tests/mir-live-validation.cjs', 'dist/mir-local-backup.js', 'dist/mir-shared*', 'dist/espace-partage.html', 'tests/mir-database.cjs', 'tests/mir-shared*', 'tests/mir-local-backup*.cjs', '.github/workflows/shared-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/database/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tools/database
      - run: node tests/mir-database.cjs
      - run: node tests/mir-local-backup.cjs
      - run: node tests/mir-live-validation.cjs
      - run: node tests/mir-phase10-management-postgres.cjs
      - run: node tests/mir-phase10-management.cjs
      - run: node --check tools/validation/real-supabase.cjs
      - run: node tests/mir-shared-client.cjs
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
      - run: node tests/mir-shared-workspace-browser.cjs
      - run: node tests/mir-shared-startup-browser.cjs
