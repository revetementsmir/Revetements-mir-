name: MIR — annotation des vrais écrans
on:
  pull_request:
    paths:
      - 'dist/annoter.html'
      - 'dist/mir-annotation-adapter.mjs'
      - 'tests/mir-annotation-browser.cjs'
      - '.github/workflows/mir-annotations-pr.yml'
permissions:
  contents: read
jobs:
  annotations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: MIR_CHROMIUM_BIN="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f | head -1)" node tests/mir-annotation-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mir-annotation-preuves
          path: artifacts/mir-annotations/
