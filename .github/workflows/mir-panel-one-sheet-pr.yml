name: MIR GOD MODE — un dessin par panneau et PDF fournisseur
on:
  pull_request:
    paths:
      - 'dist/mir-panel-po-pdf.js'
      - 'dist/mir-panel-admin.css'
      - 'dist/mir-po-workflow.js'
      - 'dist/mir-procurement.js'
      - 'dist/production.html'
      - 'tests/mir-panel-one-sheet*.cjs'
      - '.github/workflows/mir-panel-one-sheet-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    name: 10 panneaux, 10 cartes, 10 fiches PDF — PC/iPad/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Syntaxe des sources
        run: |
          node --check dist/mir-panel-po-pdf.js
          node --check dist/mir-po-workflow.js
          node --check dist/mir-procurement.js
          node --check tests/mir-panel-one-sheet.cjs
          node --check tests/mir-panel-one-sheet-browser.cjs
      - name: Recette du calcul et PDF sans répétition
        run: |
          node tests/mir-panel-one-sheet.cjs
          node tests/mir-wall-panel-po.cjs
          node tests/mir-po-workflow.cjs
          node tests/mir-procurement.cjs
      - name: Installer Playwright pour Chrome
        run: npm install --no-save playwright@1.58.2
      - name: Onglet Panneaux et PDF fournisseur réel
        run: node tests/mir-panel-one-sheet-browser.cjs
      - name: Calepinage → bon et anciens bons de pliage
        run: |
          node tests/mir-wall-panel-po-browser.cjs
          MIR_CHROMIUM_BIN=$(command -v chromium || command -v google-chrome) node tests/mir-purchase-orders-browser.cjs
      - name: Aperçus et captures de navigateur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MIR-GODMODE-Panneaux-PC-iPad-telephone
          path: artifacts/MIR-GODMODE-*.png
          if-no-files-found: ignore
      - name: Le vrai PDF fournisseur (11 pages)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MIR-NOUVEAU-bon-10-panneaux-GODMODE
          path: artifacts/MIR-NOUVEAU-bon-10-panneaux-GODMODE.pdf
          if-no-files-found: ignore
