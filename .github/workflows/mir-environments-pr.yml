name: MIR — sites TEST et PRODUCTION
on:
  pull_request:
    paths:
      - 'dist/mir-responsive-*'
      - 'dist/mir-test-guard.js'
      - 'scripts/build-mir-test.cjs'
      - 'tests/mir-test-*'
      - '.github/workflows/mir-environments-pr.yml'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
jobs:
  environments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/mir-test-environment.cjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: MIR_CHROMIUM_BIN="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f | head -1)" node tests/mir-test-production-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mir-environments-preuves
          path: artifacts/mir-environments/
