name: MIR atelier v4 — validation PR
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/production*'
      - 'dist/studio-wall-sections.js'
      - 'dist/studio-features.js'
      - 'dist/plan-app.js'
      - 'dist/plan.html'
      - 'dist/plan.css'
      - 'tests/mir-studio-wall-sections*.cjs'
      - 'tests/mir-retours-cotes*.cjs'
      - 'dist/mir-miniature.js'
      - 'dist/custom-model-cards*'
      - 'dist/boutique.html'
      - 'dist/selection.html'
      - 'dist/commerce.js'
      - 'dist/mir-selection-pdf.js'
      - 'tests/mir-selection-pdf*.cjs'
      - 'tests/mir-client-signature.cjs'
      - 'dist/mir-public-menu.*'
      - 'dist/realisations.html'
      - 'dist/materiaux.html'
      - 'dist/produit.html'
      - 'dist/selection.html'
      - 'dist/pliage.html'
      - 'tests/mir-unified-dossier*.cjs'
      - 'tests/mir-production-client-flow-browser.cjs'
      - 'tests/mir-public-menu*.cjs'
      - 'tests/mir-client-header-browser.cjs'
      - 'dist/commerce.css'
      - 'dist/mir-procurement.css'
      - 'dist/mir-unified-*'
      - 'dist/selection.html'
      - 'dist/mir-production-client-nav.*'
      - 'dist/mir-admin-guided*'
      - 'dist/mir-admin-live3d.js'
      - 'tests/mir-admin-guided*.cjs'
      - 'dist/mir-procurement.js'
      - 'dist/mir-workshop-reset*'
      - 'dist/vider-atelier.html'
      - 'tests/mir-workshop-reset*.cjs'
      - 'tests/mir-miniatures*.cjs'
      - 'tests/mir-procurement.cjs'
      - 'tests/mir-pliage-audit-*.cjs'
      - '.github/workflows/pages.yml'
      - 'dist/kaycan-flat-preview.js'
      - 'tests/mir-kaycan-flat-preview.cjs'
      - 'tests/mir-mac-flat-preview.cjs'
      - 'tests/mir-direct-po-browser.cjs'
      - 'tests/mir-purchase-orders-browser.cjs'
      - 'tests/mir-drawing-pan-browser.cjs'
      - 'tests/mir-atelier-v4.cjs'
      - 'tests/mir-atelier-v4-browser.cjs'
      - 'tests/mir-moulure-renaming-browser.cjs'
      - '.github/workflows/atelier-v4-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Geometry, JS and responsive contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check dist/production-model.js
          node --check dist/studio-wall-sections.js
          node --check dist/studio-features.js
          node --check dist/plan-app.js
          node --check tests/mir-studio-wall-sections.cjs
          node --check tests/mir-studio-wall-sections-browser.cjs
          node --check tests/mir-retours-cotes.cjs
          node --check tests/mir-retours-cotes-browser.cjs
          node --check dist/production-app.js
          node --check dist/mir-public-menu.js
          node --check dist/mir-production-client-nav.js
          node --check dist/mir-unified-client-dossier.js
          node --check tests/mir-unified-dossier.cjs
          node --check tests/mir-unified-dossier-browser.cjs
          node --check tests/mir-production-client-flow-browser.cjs
          node --check dist/mir-selection-pdf.js
          node --check tests/mir-selection-pdf-browser.cjs
          node --check tests/mir-public-menu-browser.cjs
          node --check dist/mir-procurement.js
          node --check dist/mir-admin-guided.js
          node --check dist/mir-admin-live3d.js
          node --check tests/mir-admin-guided-browser.cjs
          node --check dist/mir-workshop-reset.js
          node --check tests/mir-workshop-reset-browser.cjs
          node --check dist/custom-model-cards.js
          node --check tests/mir-pliage-audit-browser.cjs
          node --check dist/mir-miniature.js
          node --check tests/mir-miniatures.cjs
          node --check tests/mir-miniatures-browser.cjs
          node --check dist/kaycan-flat-preview.js
          node --check tests/mir-kaycan-flat-preview.cjs
          node --check tests/mir-mac-flat-preview.cjs
          node --check tests/mir-direct-po-browser.cjs
          node --check tests/mir-purchase-orders-browser.cjs
          node --check tests/mir-drawing-pan-browser.cjs
          node --check dist/production-admin-v4.js
          node --check tests/mir-atelier-v4.cjs
          node --check tests/mir-atelier-v4-browser.cjs
          node --check tests/mir-moulure-renaming-browser.cjs
      - name: Existing MIR regression suite
        run: |
          node tests/mir-pages-regressions.cjs
          node tests/mir-public-menu.cjs
          node tests/mir-unified-dossier.cjs
          node tests/mir-selection-pdf.cjs
          node tests/mir-client-signature.cjs
          node tests/mir-procurement.cjs
          node tests/mir-admin-guided.cjs
          node tests/mir-workshop-reset.cjs
          node --check tests/mir-pliage-audit-commercial.cjs
          node tests/mir-pliage-audit-commercial.cjs
      - name: Atelier maquette 4 scenarios
        run: |
          node tests/mir-atelier-v4.cjs
          node tests/mir-miniatures.cjs
          node tests/mir-retours-cotes.cjs
          node tests/mir-studio-wall-sections.cjs
      - name: Responsive real-browser QA (Chrome)
        run: |
          npm install --no-save playwright@1.58.2
          node tests/mir-public-menu-browser.cjs
          node tests/mir-production-client-flow-browser.cjs
          node tests/mir-unified-dossier-browser.cjs
          node tests/mir-selection-pdf-browser.cjs
          node tests/mir-client-header-browser.cjs
          node tests/mir-atelier-v4-browser.cjs
          node tests/mir-pliage-audit-browser.cjs
          node tests/mir-admin-guided-browser.cjs
          node tests/mir-workshop-reset-browser.cjs
          node tests/mir-kaycan-flat-preview.cjs
          node tests/mir-mac-flat-preview.cjs
          node tests/mir-direct-po-browser.cjs
          node tests/mir-purchase-orders-browser.cjs
          node tests/mir-drawing-pan-browser.cjs
          node tests/mir-moulure-renaming-browser.cjs
          node tests/mir-miniatures-browser.cjs
          node tests/mir-retours-cotes-browser.cjs
          node tests/mir-studio-wall-sections-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mir-atelier-v4-responsive-screenshots
          path: |
            artifacts/atelier-v4-*.png
            artifacts/kaycan-fix-*.png
            artifacts/mac-flat-*.png
            artifacts/mir-direct-po-*.png
            artifacts/mir-reset-*.png
            artifacts/mir-admin-guide-*.png
            artifacts/mir-menu-*.png
            artifacts/mir-client-parcours-*.png
            artifacts/mir-dossier-commun-*.png
            artifacts/mir-pan-*.png
            artifacts/mir-rename-*.png
            artifacts/mir-miniatures-*.png
            artifacts/mir-retours-*.png
            artifacts/mir-studio-wall-parts-*.png
          if-no-files-found: ignore
