name: MIR chat Phase 3B PDF real TEST
on:
  pull_request:
    paths:
      - 'tools/validation/mir-chat-phase3b-real.py'
      - 'tools/validation/mir-chat-tenant-b-once.py'
      - '.github/workflows/mir-chat-phase3b-real.yml'
      - 'supabase/functions/mir-chat-files/**'
      - 'supabase/functions/mir-chat-tenant-b-recipe/**'
      - 'supabase/functions/_shared/chat-file*.mjs'
      - 'supabase/migrations/*chat_phase3b*'
      - 'dist/portal-client.js'
      - 'dist/chantier-app.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mir-chat-phase3b-real-test
  cancel-in-progress: false
jobs:
  targeted-real-test:
    if: github.head_ref == 'codex/phase-3b-clavardage-mobile' || github.ref_name == 'codex/phase-3b-clavardage-mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIR_CHAT_WORK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MIR_CHAT_REAL_REPORT: artifacts/mir-chat-phase3b-real.json
      MIR_SANDBOX_PUBLISHABLE_KEY: ${{ secrets.MIR_SANDBOX_PUBLISHABLE_KEY }}
      MIR_SANDBOX_ADMIN_EMAIL: ${{ secrets.MIR_SANDBOX_ADMIN_EMAIL }}
      MIR_SANDBOX_ADMIN_PASSWORD: ${{ secrets.MIR_SANDBOX_ADMIN_PASSWORD }}
      MIR_SANDBOX_BOSS_EMAIL: ${{ secrets.MIR_SANDBOX_BOSS_EMAIL }}
      MIR_SANDBOX_BOSS_PASSWORD: ${{ secrets.MIR_SANDBOX_BOSS_PASSWORD }}
      MIR_SANDBOX_CHEF_EMAIL: ${{ secrets.MIR_SANDBOX_CHEF_EMAIL }}
      MIR_SANDBOX_CHEF_PASSWORD: ${{ secrets.MIR_SANDBOX_CHEF_PASSWORD }}
      MIR_SANDBOX_EMPLOYEE_EMAIL: ${{ secrets.MIR_SANDBOX_EMPLOYEE_EMAIL }}
      MIR_SANDBOX_EMPLOYEE_PASSWORD: ${{ secrets.MIR_SANDBOX_EMPLOYEE_PASSWORD }}
      MIR_SANDBOX_ASSISTANT_EMAIL: ${{ secrets.MIR_SANDBOX_ASSISTANT_EMAIL }}
      MIR_SANDBOX_ASSISTANT_PASSWORD: ${{ secrets.MIR_SANDBOX_ASSISTANT_PASSWORD }}
      MIR_SANDBOX_WAREHOUSE_EMAIL: ${{ secrets.MIR_SANDBOX_WAREHOUSE_EMAIL }}
      MIR_SANDBOX_WAREHOUSE_PASSWORD: ${{ secrets.MIR_SANDBOX_WAREHOUSE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Photo et PDF réels par la passerelle privée
        run: python3 tools/validation/mir-chat-phase3b-real.py
      - name: Isolation A vers B et B vers A, photo et PDF
        run: python3 tools/validation/mir-chat-tenant-b-once.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mir-chat-phase3b-real
          path: artifacts/mir-chat-phase3b-real.json
          if-no-files-found: error
          retention-days: 14
