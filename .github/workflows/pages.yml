          grep -F 'mir-bending-presets.js?v=profils-1' /tmp/production.html
          fetch "$base/mir-bending-presets.js" /tmp/mir-profiles.js
          grep -F "id:'coin_arch_j'" /tmp/mir-profiles.js
          fetch "$base/model-measure-defaults.js" /tmp/model-measure-defaults.js
          grep -F 'function prepare(template,source)' /tmp/model-measure-defaults.js
