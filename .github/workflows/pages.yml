name: Publish MIR copy
on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mir-pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test MIR architectural profiles
        run: node tests/mir-pages-regressions.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published MIR pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          fetch() {
            curl --fail --silent --show-error --location \
              --retry 20 --retry-delay 3 --retry-all-errors "$1" -o "$2"
          }
          fetch "$base/metres.html" /tmp/metres.html
          grep -F 'href="atelier-essai/index.html"' /tmp/metres.html
          fetch "$base/production.html" /tmp/production.html
          grep -F 'href="atelier-essai/index.html" data-admin-only' /tmp/production.html
          grep -F 'href="atelier-essai/pliages-integration-candidate.html?production=1"' /tmp/production.html
          grep -F 'mir-bending-presets.js?v=profils-1' /tmp/production.html
          fetch "$base/mir-bending-presets.js" /tmp/mir-profiles.js
          grep -F "id:'coin_arch_j'" /tmp/mir-profiles.js
          fetch "$base/atelier-essai/pliages-integration-candidate.html?production=1" /tmp/coins.html
          grep -F 'MIR — Solin brique et coins architecturaux' /tmp/coins.html
          fetch "$base/atelier-essai/mir-calepinage-extension.js" /tmp/extension.js
          grep -F 'const pitch = value =>' /tmp/extension.js
          fetch "$base/atelier-essai/index.html" /tmp/atelier.html
          grep -F 'Atelier d’essai MIR' /tmp/atelier.html
          echo "MIR Pages verified at $base/"
