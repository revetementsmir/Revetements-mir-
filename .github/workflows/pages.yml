name: Publier le site principal MIR
on:
  push:
    branches: [main]
    paths: ['dist/**', 'tests/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mir-pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test MIR architectural profiles
        run: |
          node --check dist/model-measure-defaults.js
          node --check dist/template-library-backup.js
          node --check dist/production-app.js
          node --check dist/mir-miniature.js
          node --check tests/mir-retours-cotes.cjs
          node --check tests/mir-retours-cotes-browser.cjs
          node --check tests/mir-miniatures.cjs
          node --check tests/mir-moulure-renaming-browser.cjs
          node --check dist/kaycan-flat-preview.js
          node --check dist/production-admin-v4.js
          node --check dist/mir-procurement.js
          node --check dist/portal-client.js
          node --check dist/chantier-app.js
          node --check tests/mir-portal-login.cjs
          node tests/mir-portal-login.cjs
          node tests/mir-procurement.cjs
          node tests/mir-pages-regressions.cjs
          node tests/mir-atelier-v4.cjs
          node tests/mir-miniatures.cjs
          node tests/mir-retours-cotes.cjs
          node --check tests/mir-homepage.cjs
          node --check tests/mir-homepage-browser.cjs
          node tests/mir-homepage.cjs
          node --check tests/mir-client-header.cjs
          node tests/mir-client-header.cjs
          node --check tests/mir-client-header-browser.cjs
      - name: Vérifier l'accueil MIR en vrai navigateur Chrome
        run: |
          npm install --no-save playwright@1.58.2
          node tests/mir-homepage-browser.cjs
          node tests/mir-client-header-browser.cjs
          node tests/mir-miniatures-browser.cjs
          node tests/mir-retours-cotes-browser.cjs
      - name: Captures accueil PC, tablette et mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mir-accueil-responsive
          path: |
            artifacts/mir-accueil-*.png
            artifacts/mir-entete-*.png
            artifacts/mir-miniatures-*.png
            artifacts/mir-retours-*.png
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - name: Préparer uniquement le site MIR principal
        run: |
          mkdir -p _site_mir
          cp -a dist/. _site_mir/
          # Conserver les moteurs techniques nécessaires au vrai site, mais ne pas publier les écrans d'essai.
          find _site_mir/atelier-essai -type f -name '*-candidate.html' -delete
          rm -f _site_mir/atelier-essai/index.html
          test ! -f _site_mir/atelier-essai/index.html
          test -f _site_mir/atelier-essai/mir-calepinage-extension.js
          test -f _site_mir/assets/MIR-logo-officiel-original.svg
          test -f _site_mir/mir-home-premium.css
          for image in mir-home-hero-20261105.avif mir-home-hero-20261105.webp mir-home-card-revetement-20261105.webp mir-home-card-pliage-20261105.webp mir-home-card-studio-20261105.webp; do test -s "_site_mir/assets/$image"; done
          if find _site_mir/atelier-essai -type f -name '*-candidate.html' | grep -q .; then
            echo "Les écrans de démonstration ne doivent pas être publiés." >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site_mir
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published MIR pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          fetch() {
            curl --fail --silent --show-error --location \
              --retry 20 --retry-delay 3 --retry-all-errors "$1" -o "$2"
          }
          fetch "$base/index.html" /tmp/mir-homepage.html
          grep -F 'mir-home-premium.css?v=images-ultrawide-20261105' /tmp/mir-homepage.html
          grep -F 'assets/MIR-logo-officiel-original.svg' /tmp/mir-homepage.html
          grep -F 'Mon compte' /tmp/mir-homepage.html
          grep -F 'Découvrir nos revêtements' /tmp/mir-homepage.html
          grep -F 'Voir notre boutique' /tmp/mir-homepage.html
          grep -F 'mir-home-card-revetement-20261105.webp' /tmp/mir-homepage.html
          grep -F 'mir-home-hero-20261105.avif' /tmp/mir-homepage.html
          fetch "$base/assets/MIR-logo-officiel-original.svg" /tmp/mir-logo.svg
          grep -F 'viewBox="0 0 363.68 91.133"' /tmp/mir-logo.svg
          fetch "$base/mir-client-header.css" /tmp/mir-client-header.css
          grep -F '.mir-client-header' /tmp/mir-client-header.css
          fetch "$base/boutique.html" /tmp/mir-boutique.html
          grep -F 'mir-client-header.css?v=1' /tmp/mir-boutique.html
          fetch "$base/plan.html" /tmp/mir-plan-public.html
          grep -F 'mir-client-header.css?v=1' /tmp/mir-plan-public.html
          fetch "$base/assets/mir-home-hero-20261105.avif" /tmp/mir-home-hero.avif
          fetch "$base/assets/mir-home-hero-20261105.webp" /tmp/mir-home-hero.webp
          fetch "$base/assets/mir-home-card-revetement-20261105.webp" /tmp/mir-card-revetement.webp
          fetch "$base/assets/mir-home-card-pliage-20261105.webp" /tmp/mir-card-pliage.webp
          fetch "$base/assets/mir-home-card-studio-20261105.webp" /tmp/mir-card-studio.webp
          test "$(wc -c </tmp/mir-home-hero.avif)" -gt 50000
          for image in revetement pliage studio; do test -s "/tmp/mir-card-$image.webp"; done
          fetch "$base/mir-home-premium.css" /tmp/mir-home-premium.css
          grep -F '.mir-home-showcase' /tmp/mir-home-premium.css
          fetch "$base/metres.html" /tmp/metres.html
          grep -F 'href="production.html?view=orders"' /tmp/metres.html
          fetch "$base/pliage.html" /tmp/pliage.html
          grep -F 'href="production.html?mode=client&amp;kind=profile&amp;profile=coin_arch_j"' /tmp/pliage.html
          fetch "$base/chantier.html" /tmp/mir-connexion.html
          grep -F 'Mon compte — Les Revêtements MIR' /tmp/mir-connexion.html
          fetch "$base/portal-config.js" /tmp/mir-portal-config.js
          grep -F 'enabled: false' /tmp/mir-portal-config.js
          fetch "$base/chantier-app.js" /tmp/mir-chantier-app.js
          grep -F 'Activation sécurisée en attente' /tmp/mir-chantier-app.js
          fetch "$base/portal-client.js" /tmp/mir-portal-client.js
          grep -F "mode: 'connected'" /tmp/mir-portal-client.js
          fetch "$base/production.html" /tmp/production.html
          grep -F 'mir-miniature.js?v=1' /tmp/production.html
          grep -F 'production-model.js?v=retours-cotes-20261105' /tmp/production.html
          grep -F 'production-admin-v4.css?v=miniatures-20261105' /tmp/production.html
          fetch "$base/mir-miniature.js" /tmp/mir-miniature.js
          grep -F "function project(points" /tmp/mir-miniature.js
          grep -F 'kaycan-flat-preview.js?v=1' /tmp/production.html
          grep -F 'production-app.js?v=miniatures-20261105' /tmp/production.html
          fetch "$base/kaycan-flat-preview.js" /tmp/kaycan-flat-preview.js
          grep -F 'function medianRgb' /tmp/kaycan-flat-preview.js
          grep -F 'production-admin-v4.css?v=miniatures-20261105' /tmp/production.html
          grep -F 'production-admin-v4.js?v=1' /tmp/production.html
          grep -F 'id="production-piece-name"' /tmp/production.html
          fetch "$base/production-admin-v4.css" /tmp/mir-admin-v4.css
          grep -F 'body.mir-admin-v4 .kind-bar' /tmp/mir-admin-v4.css
          fetch "$base/mir-procurement.js" /tmp/mir-procurement.js
          grep -F 'mir_admin_procurement_v1' /tmp/mir-procurement.js
          fetch "$base/mir-procurement.css" /tmp/mir-procurement.css
          grep -F '#mir-procurement-tabs' /tmp/mir-procurement.css
          grep -F 'mir-procurement.js?v=2' /tmp/production.html
          fetch "$base/production-admin-v4.js" /tmp/mir-admin-v4.js
          grep -F 'mir-v4-sheet-total' /tmp/mir-admin-v4.js
          grep -F 'href="production.html?view=orders" data-admin-only' /tmp/production.html
          grep -F 'href="production.html?profile=solin_brique"' /tmp/production.html
          grep -F 'href="production.html?profile=coin_arch_j"' /tmp/production.html
          grep -F 'mir-bending-presets.js?v=profils-1' /tmp/production.html
          fetch "$base/mir-bending-presets.js" /tmp/mir-profiles.js
          grep -F "id:'coin_arch_j'" /tmp/mir-profiles.js
          fetch "$base/model-measure-defaults.js" /tmp/model-measure-defaults.js
          grep -F 'function prepare(template,source)' /tmp/model-measure-defaults.js
          fetch "$base/production.html" /tmp/mir-production.html
          grep -F 'model-measure-defaults.js?v=defaults-1' /tmp/mir-production.html
          fetch "$base/template-library-backup.js" /tmp/mir-template-backup.js
          grep -F "mir-template-library-backup-1" /tmp/mir-template-backup.js
          fetch "$base/production.html" /tmp/mir-backup-page.html
          grep -F 'template-library-backup.js?v=backup-1' /tmp/mir-backup-page.html
          fetch "$base/production-app.js" /tmp/production-app.js
          grep -F 'old?.channels?.client===true' /tmp/production-app.js
          grep -F 'old?.channels?.store===true' /tmp/production-app.js
          grep -F 'Nouveau modèle privé par défaut sur cet appareil' /tmp/production-app.js
          grep -F 'data-rename-piece=' /tmp/production-app.js
          grep -F 'M.reviseInstance({snapshot:old.snapshot' /tmp/production-app.js
          grep -F "const requestedProfile=params.get('profile')" /tmp/production-app.js
          fetch "$base/production-model.js" /tmp/production-model.js
          grep -F 'const radius=5, side=bends[i-1].direction' /tmp/production-model.js
          grep -F 'class="profile-marker-overflow"' /tmp/production-model.js
          grep -F 'function profileDrawingSection(' /tmp/production-model.js
          grep -F "const oldHem=base?.bends?.[i]?.mode==='hem'" /tmp/production-app.js
          fetch "$base/atelier-essai/mir-calepinage-extension.js" /tmp/extension.js
          grep -F 'const pitch = value =>' /tmp/extension.js
          fetch "$base/calepinage.html" /tmp/calepinage.html
          grep -F 'id="outline-right-angle"' /tmp/calepinage.html
          grep -F 'id="roof-pitch"' /tmp/calepinage.html
          grep -F 'id="piece-width-lock"' /tmp/calepinage.html
          fetch "$base/calepinage-app.js" /tmp/calepinage-app.js
          grep -F 'event.shiftKey||outlineRightAngle' /tmp/calepinage-app.js
          grep -F 'A?.gableFromPitch?.(width,eave,leftPitch,rightPitch)' /tmp/calepinage-app.js
          grep -F 'E.setPanelSize(layout.config,axis' /tmp/calepinage-app.js
          fetch "$base/plan.html" /tmp/plan.html
          grep -F 'material-coverage.js' /tmp/plan.html
          grep -F 'id="material-format"' /tmp/plan.html
          grep -F 'id="coverage-input"' /tmp/plan.html
          fetch "$base/material-coverage.js" /tmp/material-coverage.js
          grep -F 'function courseLayout' /tmp/material-coverage.js
          grep -F 'function panelGrid' /tmp/material-coverage.js
          fetch "$base/material-surface.js" /tmp/material-surface.js
          grep -F 'Changing 5 in to 7 in' /tmp/material-surface.js
          fetch "$base/plan-app.js" /tmp/plan-app.js
          grep -F 'The stored soffit paths locate undersides' /tmp/plan-app.js
          fetch "$base/plan-3d.js" /tmp/plan-3d.js
          grep -F "'recessed-assumption' and 'recessed-confirmed' both continue to wallHeight" /tmp/plan-3d.js
          echo "MIR Pages verified at $base/"
