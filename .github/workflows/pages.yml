          grep -F 'mir-po-workflow.js?v=orders-2' /tmp/production.html
          fetch "$base/mir-po-workflow.js" /tmp/mir-po-workflow.js
          grep -F 'function pdfFaces(' /tmp/mir-po-workflow.js
          fetch "$base/production-admin-v4.js" /tmp/mir-admin-v4.js
          grep -F 'mir-v4-sheet-total' /tmp/mir-admin-v4.js
