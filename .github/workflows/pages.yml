          grep -F "data-mir-live-3d" /tmp/mir-admin-live3d.js
          fetch "$base/mir-admin-guided.css" /tmp/mir-admin-guided.css
          grep -F "mir-guide-3d-open" /tmp/mir-admin-guided.css
          fetch "$base/mir-procurement.js" /tmp/mir-procurement.js
          grep -F 'mir_admin_procurement_v1' /tmp/mir-procurement.js
          fetch "$base/vider-atelier.html" /tmp/mir-reset-page.html
          grep -F 'Remettre mon atelier à zéro' /tmp/mir-reset-page.html
          fetch "$base/mir-workshop-reset.js" /tmp/mir-reset-app.js
          grep -F 'mir_production_templates_v1' /tmp/mir-reset-app.js
          fetch "$base/mir-procurement.css" /tmp/mir-procurement.css
          grep -F '#mir-procurement-tabs' /tmp/mir-procurement.css
          grep -F 'mir-procurement.js?v=orders-pdf-2' /tmp/production.html
