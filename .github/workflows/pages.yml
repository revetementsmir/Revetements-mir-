name: Publier le site principal MIR
on:
  push:
    branches: [main]
    paths: ['dist/**', 'tests/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mir-pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test MIR architectural profiles
        run: |
          node --check dist/model-measure-defaults.js
          node --check dist/template-library-backup.js
          node --check dist/production-app.js
          node --check dist/mir-direct-model-save.js
          node tests/mir-direct-model-save.cjs
          node --check dist/mir-bending-lengths.js
          node --check tests/mir-bending-lengths.cjs
          node tests/mir-bending-lengths.cjs
          node --check dist/mir-bending-finishes.js
          node --check dist/studio-wall-sections.js
          node --check dist/studio-features.js
          node --check dist/plan-app.js
          node --check tests/mir-studio-wall-sections.cjs
          node --check tests/mir-studio-wall-sections-browser.cjs
          node --check dist/mir-miniature.js
          node --check tests/mir-retours-cotes.cjs
          node --check tests/mir-retours-cotes-browser.cjs
          node --check tests/mir-miniatures.cjs
          node --check tests/mir-moulure-renaming-browser.cjs
          node --check dist/kaycan-flat-preview.js
          node --check tests/mir-mac-flat-preview.cjs
          node --check tests/mir-direct-po-browser.cjs
          node --check tests/mir-drawing-pan-browser.cjs
          node --check tests/mir-atelier-v4-browser.cjs
          node --check dist/production-admin-v4.js
          node --check dist/mir-procurement.js
          node --check dist/mir-po-workflow.js
          node --check tests/mir-purchase-orders-browser.cjs
          node tests/mir-po-workflow.cjs
          node --check dist/mir-admin-guided.js
          node --check dist/mir-admin-live3d.js
          node --check tests/mir-admin-guided-browser.cjs
          node --check dist/mir-workshop-reset.js
          node --check tests/mir-workshop-reset-browser.cjs
          node --check dist/custom-model-cards.js
          node --check tests/mir-pliage-audit-browser.cjs
          node --check dist/portal-client.js
          node --check dist/chantier-app.js
          node --check tests/mir-portal-login.cjs
          node tests/mir-portal-login.cjs
          node tests/mir-procurement.cjs
          node tests/mir-admin-guided.cjs
          node tests/mir-workshop-reset.cjs
          node --check tests/mir-pliage-audit-commercial.cjs
          node tests/mir-pliage-audit-commercial.cjs
          node --check dist/plan-import.js
          node --check dist/plan-facade-visual.js
          node tests/mir-plan-sheet-detection.cjs
          node --check dist/plan-3d.js
          node --check tests/mir-balcony.cjs
          node tests/mir-balcony.cjs
          node --check tests/mir-balcony-browser.cjs
          node --check dist/plan-structure-notes.js
          node --check tests/mir-structure-hints.cjs
          node tests/mir-structure-hints.cjs
          node --check dist/plan-stair-vision.js
          node --check tests/mir-stair-vision.cjs
          node --check tests/mir-stair-integration-browser.cjs
          node tests/mir-stair-vision.cjs
          node --check dist/mir-vertical-layout.js
          node --check tests/mir-vertical-layout.cjs
          node tests/mir-vertical-layout.cjs
          node --check tests/mir-new-materials.cjs
          node tests/mir-new-materials.cjs
          node --check tests/mir-new-materials-browser.cjs
          node --check tests/mir-studio-grounds.cjs
          node tests/mir-studio-grounds.cjs
          node --check dist/plan-app.js
          node --check dist/studio-features.js
          node --check tests/mir-studio-interactions.cjs
          node --check tests/mir-studio-terrain-browser.cjs
          node tests/mir-studio-interactions.cjs
          node --check tests/mir-finishing-editor.cjs
          node tests/mir-finishing-editor.cjs
          node --check tests/mir-finishing-editor-browser.cjs
          node tests/mir-pages-regressions.cjs
          node tests/mir-atelier-v4.cjs
          node tests/mir-miniatures.cjs
          node tests/mir-retours-cotes.cjs
          node tests/mir-studio-wall-sections.cjs
          node --check tests/mir-homepage.cjs
          node --check tests/mir-homepage-browser.cjs
          node tests/mir-homepage.cjs
          node --check dist/mir-public-menu.js
          node --check dist/mir-production-client-nav.js
          node --check tests/mir-production-client-flow-browser.cjs
          node --check dist/mir-selection-pdf.js
          node --check tests/mir-selection-pdf-browser.cjs
          node tests/mir-selection-pdf.cjs
          node --check tests/mir-public-menu-browser.cjs
          node tests/mir-public-menu.cjs
          node --check tests/mir-client-header.cjs
          node tests/mir-client-header.cjs
          node --check tests/mir-client-signature.cjs
          node tests/mir-client-signature.cjs
          node --check tests/mir-realisations.cjs
          node tests/mir-realisations.cjs
          node --check dist/mir-realisations.js
          node --check tests/mir-realisations-browser.cjs
          node --check tests/mir-client-signature-browser.cjs
          node --check tests/mir-production-signature-browser.cjs
          test -s dist/mir-production-signature.css
          node --check tests/mir-client-header-browser.cjs
      - name: Vérifier l'accueil MIR en vrai navigateur Chrome
        run: |
          npm install --no-save playwright@1.58.2
          node tests/mir-plan-pdf-browser.cjs
          node tests/mir-stair-integration-browser.cjs
          node tests/mir-new-materials-browser.cjs
          node tests/mir-retours-cotes-browser.cjs
          node tests/mir-homepage-browser.cjs
          node tests/mir-client-header-browser.cjs
          node tests/mir-public-menu-browser.cjs
          node tests/mir-production-client-flow-browser.cjs
          node tests/mir-selection-pdf-browser.cjs
          node tests/mir-client-signature-browser.cjs
          node tests/mir-production-signature-browser.cjs
          node tests/mir-realisations-browser.cjs
          node tests/mir-miniatures-browser.cjs
          node tests/mir-direct-po-browser.cjs
          node tests/mir-drawing-pan-browser.cjs
          node tests/mir-atelier-v4-browser.cjs
          node tests/mir-purchase-orders-browser.cjs
          node tests/mir-pliage-audit-browser.cjs
          node tests/mir-admin-guided-browser.cjs
          node tests/mir-workshop-reset-browser.cjs
          node tests/mir-studio-wall-sections-browser.cjs
          node tests/mir-balcony-browser.cjs
          node tests/mir-studio-terrain-browser.cjs
          node tests/mir-finishing-editor-browser.cjs
          node tests/mir-shared-startup-browser.cjs
      - name: Captures accueil PC, tablette et mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mir-accueil-responsive
          path: |
            artifacts/mir-accueil-*.png
            artifacts/mir-entete-*.png
            artifacts/mir-menu-*.png
            artifacts/mir-client-parcours-*.png
            artifacts/mir-signature-*.png
            artifacts/mir-production-signature-*.png
            artifacts/mir-realisations-*.png
            artifacts/mir-miniatures-*.png
            artifacts/mir-direct-po-*.png
            artifacts/mir-reset-*.png
            artifacts/mir-admin-guide-*.png
            artifacts/mir-pan-*.png
            artifacts/mir-retours-*.png
            artifacts/mir-studio-wall-parts-*.png
            artifacts/mir-balcon-3d-*.png
            artifacts/mir-terrain-fullscreen-*.png
            artifacts/mir-finitions-*.png
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - name: Préparer uniquement le site MIR principal
        run: |
          mkdir -p _site_mir
          cp -a dist/. _site_mir/
          # Conserver les moteurs techniques nécessaires au vrai site, mais ne pas publier les écrans d'essai.
          find _site_mir/atelier-essai -type f -name '*-candidate.html' -delete
          rm -f _site_mir/atelier-essai/index.html
          test ! -f _site_mir/atelier-essai/index.html
          test -f _site_mir/atelier-essai/mir-calepinage-extension.js
          test -f _site_mir/assets/MIR-logo-officiel-original.svg
          test -f _site_mir/mir-home-premium.css
          test -s _site_mir/realisations.html
          for photo in realisations-mir-contemporain-brun-large.webp realisations-mir-contemporain-brun-mobile.webp realisations-mir-contrastes-large.webp realisations-mir-contrastes-mobile.webp realisations-mir-classique-large.webp realisations-mir-classique-mobile.webp; do test -s "_site_mir/assets/realisations/$photo"; done
          for image in mir-home-hero-20261105.avif mir-home-hero-20261105.webp mir-home-card-revetement-20261105.webp mir-home-card-pliage-20261105.webp mir-home-card-studio-20261105.webp; do test -s "_site_mir/assets/$image"; done
          if find _site_mir/atelier-essai -type f -name '*-candidate.html' | grep -q .; then
            echo "Les écrans de démonstration ne doivent pas être publiés." >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site_mir
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published MIR pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          fetch() {
            curl --fail --silent --show-error --location \
              --retry 20 --retry-delay 3 --retry-all-errors "$1" -o "$2"
          }
          fetch "$base/index.html" /tmp/mir-homepage.html
          grep -F 'mir-home-premium.css?v=images-ultrawide-20261105' /tmp/mir-homepage.html
          grep -F 'assets/MIR-logo-officiel-original.svg' /tmp/mir-homepage.html
          grep -F 'Mon compte' /tmp/mir-homepage.html
          grep -F 'Découvrir nos revêtements' /tmp/mir-homepage.html
          grep -F 'Voir notre boutique' /tmp/mir-homepage.html
          grep -F 'mir-home-card-revetement-20261105.webp' /tmp/mir-homepage.html
          grep -F 'mir-home-hero-20261105.avif' /tmp/mir-homepage.html
          fetch "$base/assets/MIR-logo-officiel-original.svg" /tmp/mir-logo.svg
          grep -F 'viewBox="0 0 363.68 91.133"' /tmp/mir-logo.svg
          fetch "$base/mir-client-signature.css" /tmp/mir-client-signature.css
          grep -F 'body.mir-signature' /tmp/mir-client-signature.css
          grep -F -- '--mir-accent:#348511' /tmp/mir-client-signature.css
          fetch "$base/mir-public-menu.css" /tmp/mir-public-menu.css
          grep -F "mir-client-menu-toggle" /tmp/mir-public-menu.css
          fetch "$base/mir-selection-pdf.js" /tmp/mir-selection-pdf.js
          grep -F 'buildOptions' /tmp/mir-selection-pdf.js
          fetch "$base/selection.html" /tmp/mir-selection.html
          grep -F 'id="selection-export-pdf"' /tmp/mir-selection.html
          fetch "$base/mir-public-menu.js" /tmp/mir-public-menu.js
          grep -F "aria-expanded" /tmp/mir-public-menu.js
          fetch "$base/pliage.html" /tmp/mir-menu-pliage.html
          grep -F "mir-public-menu.js?v=1" /tmp/mir-menu-pliage.html
          fetch "$base/mir-client-header.css" /tmp/mir-client-header.css
          grep -F '.mir-client-header' /tmp/mir-client-header.css
          fetch "$base/realisations.html" /tmp/mir-realisations.html
          grep -F 'Nos réalisations' /tmp/mir-realisations.html
          grep -F 'realisations-mir-contemporain-brun-large.webp' /tmp/mir-realisations.html
          grep -F 'realisations-mir-contrastes-large.webp' /tmp/mir-realisations.html
          grep -F 'realisations-mir-classique-large.webp' /tmp/mir-realisations.html
          fetch "$base/assets/realisations/realisations-mir-contemporain-brun-large.webp" /tmp/mir-realisations-1.webp
          test "$(wc -c </tmp/mir-realisations-1.webp)" -gt 100000
          grep -F 'realisations-mir-quebec-avec-voiture-large.avif' /tmp/mir-realisations.html
          grep -F 'Photo originale fournie par MIR · voiture conservée' /tmp/mir-realisations.html
          fetch "$base/assets/realisations/realisations-mir-quebec-avec-voiture-large.avif" /tmp/mir-realisations-4.avif
          fetch "$base/assets/realisations/realisations-mir-quebec-avec-voiture-mobile.avif" /tmp/mir-realisations-4-mobile.avif
          test "$(wc -c </tmp/mir-realisations-4.avif)" -gt 50000
          test "$(wc -c </tmp/mir-realisations-4-mobile.avif)" -gt 15000
          fetch "$base/mir-realisations.css" /tmp/mir-realisations.css
          grep -F '.mir-gallery-grid' /tmp/mir-realisations.css
          fetch "$base/boutique.html" /tmp/mir-boutique.html
          grep -F 'href="realisations.html"' /tmp/mir-boutique.html
          grep -F 'mir-client-header.css?v=1' /tmp/mir-boutique.html
          grep -F 'mir-client-signature.css?v=1' /tmp/mir-boutique.html
          fetch "$base/plan.html?verification=$GITHUB_SHA" /tmp/mir-plan-public.html
          cmp /tmp/mir-plan-public.html _site_mir/plan.html
          grep -F 'mir-client-header.css?v=1' /tmp/mir-plan-public.html
          for asset in mir-bending-finishes.js plan-import.js plan-stair-vision.js mir-vertical-layout.js plan-scan-ocr.js plan-sheet-detection.js plan-spatial-dimensions.js plan-facade-visual.js plan-app.js plan-3d.js plan.css plan-annotations.js plan-annotations.css studio-wall-sections.js studio-features.js material-surface.js catalogue-fd6866b49d21.json; do
            fetch "$base/$asset?verification=$GITHUB_SHA" "/tmp/mir-$asset"
            cmp "/tmp/mir-$asset" "_site_mir/$asset"
          done
          grep -F 'MIRSheetDetection' /tmp/mir-plan-import.js
          grep -F 'MIRStairVision.detect' /tmp/mir-plan-import.js
          grep -F 'MIRVerticalLayout' /tmp/mir-mir-vertical-layout.js
          grep -F 'mir-vertical-layout.js?v=1' /tmp/mir-plan-public.html
          grep -F 'batten-spacing' /tmp/mir-plan-public.html
          grep -F 'raster-parallel-risers-calibrated' /tmp/mir-plan-stair-vision.js
          fetch "$base/assets/mir-home-hero-20261105.avif" /tmp/mir-home-hero.avif
          fetch "$base/assets/mir-home-hero-20261105.webp" /tmp/mir-home-hero.webp
          fetch "$base/assets/mir-home-card-revetement-20261105.webp" /tmp/mir-card-revetement.webp
          fetch "$base/assets/mir-home-card-pliage-20261105.webp" /tmp/mir-card-pliage.webp
          fetch "$base/assets/mir-home-card-studio-20261105.webp" /tmp/mir-card-studio.webp
          test "$(wc -c </tmp/mir-home-hero.avif)" -gt 50000
          for image in revetement pliage studio; do test -s "/tmp/mir-card-$image.webp"; done
          fetch "$base/mir-home-premium.css" /tmp/mir-home-premium.css
          grep -F '.mir-home-showcase' /tmp/mir-home-premium.css
          fetch "$base/metres.html" /tmp/metres.html
          grep -F 'href="production.html?view=orders"' /tmp/metres.html
          fetch "$base/pliage.html" /tmp/pliage.html
          grep -F 'href="production.html?mode=client&amp;kind=profile&amp;profile=coin_arch_j"' /tmp/pliage.html
          fetch "$base/chantier.html" /tmp/mir-connexion.html
          grep -F 'Mon compte — Les Revêtements MIR' /tmp/mir-connexion.html
          fetch "$base/portal-config.js" /tmp/mir-portal-config.js
          grep -F 'enabled: false' /tmp/mir-portal-config.js
          fetch "$base/chantier-app.js" /tmp/mir-chantier-app.js
          grep -F 'Activation sécurisée en attente' /tmp/mir-chantier-app.js
          fetch "$base/portal-client.js" /tmp/mir-portal-client.js
