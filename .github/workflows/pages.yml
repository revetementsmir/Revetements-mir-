          fetch "$base/mir-miniature.js" /tmp/mir-miniature.js
          grep -F "function project(points" /tmp/mir-miniature.js
          grep -F 'kaycan-flat-preview.js?v=mac-2' /tmp/production.html
          grep -F 'production-app.js?v=direct-shared-save-1' /tmp/production.html
          grep -F 'mir-bending-finishes.js?v=1' /tmp/production.html
          fetch "$base/kaycan-flat-preview.js" /tmp/kaycan-flat-preview.js
          grep -F 'function medianRgb' /tmp/kaycan-flat-preview.js
          grep -F 'function isMAC' /tmp/kaycan-flat-preview.js
          grep -F 'production-admin-v4.css?v=deplacer-vue-20261105' /tmp/production.html
