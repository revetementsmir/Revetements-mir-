name: MIR Studio S1 + S2 contours and site dossier
on:
  pull_request:
    paths:
      - 'dist/plan*.js'
      - 'dist/plan*.html'
      - 'dist/plan-import.css'
      - 'dist/plan*.css'
      - 'dist/studio*.js'
      - 'dist/studio*.css'
      - 'dist/annotated-pdf.js'
      - 'dist/mir-dossier-pdf.js'
      - 'dist/mir-private-document-viewer.*'
      - 'dist/chantier.html'
      - 'dist/portal-client.js'
      - 'dist/chantier-app.js'
      - 'supabase/migrations/*mir_studio*.sql'
      - 'dist/project-store.js'
      - 'dist/takeoff-app.js'
      - 'dist/metres.html'
      - 'dist/mir-client-en-ca.js'
      - 'dist/mir-client-i18n.js'
      - 'docs/verification/mir-studio-s1-import.md'
      - 'tests/mir-studio-*.cjs'
      - 'tests/mir-plan-dimension-ticks.cjs'
      - 'tests/mir-plan-interrupted-dimensions.cjs'
      - 'tests/helpers/mir-studio-s2-model.cjs'
      - 'tests/helpers/mir-studio-entry-fixture.cjs'
      - 'tests/helpers/mir-studio-flat-entry-fixture.cjs'
      - 'tests/helpers/mir-studio-flat-measured-entry-fixture.cjs'
      - 'docs/verification/mir-studio-seven-originals.md'
      - 'docs/verification/mir-studio-s2.md'
      - 'tools/qa/mir-studio*.cjs'
      - 'tools/qa/helpers/mir-studio*.cjs'
      - 'tests/helpers/mir-studio-s1-fixture.cjs'
      - '.github/workflows/mir-studio-s1-pr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and existing contracts
        env:
          MIR_CLIENT_BASE_SHA: ${{ github.event.pull_request.base.sha || 'e9bd39bc5dd4c40663c56bfc21759c543ab4e8d9' }}
        run: |
          git fetch origin "$MIR_CLIENT_BASE_SHA" --depth=1
          git diff --check
          for file in dist/plan-import.js dist/plan-sheet-detection.js dist/plan-scan-ocr.js dist/plan-view-inventory.js dist/plan-view-review.js dist/project-store.js dist/plan-app.js dist/takeoff-app.js dist/plan-level-model.js dist/plan-reconstruction*.js dist/plan-reconstructed*.js dist/plan-scene-order.js dist/plan-level-studio.js dist/studio*.js dist/mir-private-document-viewer.js; do node --check "$file"; done
          node --check tests/mir-studio-entry-assemblies-browser.cjs
          node tests/mir-studio-s1.cjs
          node tests/mir-studio-s2.cjs
          node tests/mir-studio-reconstruction.cjs
          node tests/mir-studio-grid-registration.cjs
          node tests/mir-studio-grid-sampling.cjs
          node tests/mir-studio-grid-labelled-groups.cjs
          node tests/mir-studio-grid-reading-policy.cjs
          node tests/mir-studio-native-source-crop.cjs
          node tests/mir-studio-fragmented-captions.cjs
          node tests/mir-studio-datum-caption-regions.cjs
          node tests/mir-studio-neighbouring-measurements.cjs
          node tests/mir-studio-dimension-word-retry.cjs
          node tests/mir-studio-native-vertical-dimensions.cjs
          node tests/mir-studio-native-horizontal-dimensions.cjs
          node tests/mir-studio-native-height-scale.cjs
          node tests/mir-studio-native-line-consumer.cjs
          node tests/mir-studio-elevation-grid.cjs
          node tests/mir-studio-level-datum-scale.cjs
          node tests/mir-studio-local-datum-calibration.cjs
          node tests/mir-studio-datum-frame.cjs
          node tests/mir-studio-metric-registration.cjs
          node tests/mir-studio-multilevel-pipeline.cjs
          node tests/mir-studio-cross-floor-outline.cjs
          node tests/mir-studio-contour-localization.cjs
          node tests/mir-studio-automatic.cjs
          node tests/mir-studio-automatic-originals-harness.cjs
          node tests/mir-studio-legend-occlusion.cjs
          node tests/mir-studio-roof-eave-evidence.cjs
          node tests/mir-studio-roof-ceiling-band.cjs
          node tests/mir-studio-roof-ridge-annotations.cjs
          node tests/mir-studio-exterior-reconstruction.cjs
          node tests/mir-studio-exterior-integration.cjs
          node tests/mir-studio-irregular-masonry.cjs
          node tests/mir-studio-registered-wall-zones.cjs
          node tests/mir-studio-masonry-reading-scope.cjs
          node tests/mir-studio-entry-elements.cjs
          node tests/mir-studio-entry-assemblies.cjs
          node tests/mir-studio-entry-profile-vision.cjs
          node tests/mir-studio-floor-thin-lines.cjs
          node tests/mir-studio-door-boundary.cjs
          node tests/mir-studio-door-corner.cjs
          node tests/mir-studio-sliding-boundary.cjs
          node tests/mir-studio-framed-wall-network.cjs
          node tests/mir-studio-offset-wall-network.cjs
          node tests/mir-studio-floor-opening-evidence.cjs
          node tests/mir-studio-opening-pane-evidence.cjs
          node tests/mir-studio-opening-cell-context.cjs
          node tests/mir-studio-source-opening-type.cjs
          node tests/mir-studio-wall-contrast.cjs
          node tests/mir-studio-wall-top-guide.cjs
          node tests/mir-studio-elevation-document-frame.cjs
          node tests/mir-studio-fragmented-openings.cjs
          node tests/mir-studio-reading-priority.cjs
          node tests/mir-studio-source-scale.cjs
          node tests/mir-studio-partial-scale.cjs
          node tests/mir-studio-calibration-marks.cjs
          node tests/mir-studio-mark-extent.cjs
          node tests/mir-studio-paper-contrast.cjs
          node tests/mir-studio-dimension-association.cjs
          node tests/mir-studio-reference-observations.cjs
          node tests/mir-plan-dimension-ticks.cjs
          node tests/mir-plan-interrupted-dimensions.cjs
          node tests/mir-studio-flat-entry-roofs.cjs
          node tests/mir-studio-preview.cjs
          node tests/mir-studio-cotation.cjs
          node tests/mir-studio-job-reader.cjs
          node tests/mir-studio-pr44-isolation.cjs
          node tests/mir-plan-sheet-detection.cjs
          node tests/mir-studio-grounds.cjs
          node tests/mir-studio-interactions.cjs
          node tests/mir-studio-wall-sections.cjs
          node tests/mir-balcony.cjs
          node tests/mir-structure-hints.cjs
          node tests/mir-stair-vision.cjs
          node tests/mir-vertical-layout.cjs
          node tests/mir-new-materials.cjs
          node tests/mir-bending-lengths.cjs
          node tests/mir-client-i18n-static.cjs
          node tests/mir-studio-public-stage.cjs
      - name: Private document SQL contracts in disposable PostgreSQL
        run: |
          npm ci --prefix tools/database --ignore-scripts --no-audit --no-fund
          node tests/mir-job-dossier-postgres.cjs
          node tests/mir-studio-site-postgres.cjs
      - name: Browser dependency
        run: npm install --no-save playwright@1.58.2
      - name: Raster import and legacy persistence (synthetic only, no backend)
        run: MIR_CHROMIUM_BIN="$(command -v google-chrome || command -v chromium)" node tests/mir-studio-s1-browser.cjs
      - name: Contours, client Confirm/Cancel, five-page local PDF (synthetic only)
        run: |
          MIR_CHROMIUM_BIN="$(command -v google-chrome || command -v chromium)" node tests/mir-studio-s2-browser.cjs
          MIR_CHROMIUM_BIN="$(command -v google-chrome || command -v chromium)" node tests/mir-studio-reconstruction-browser.cjs
          MIR_CHROMIUM_BIN="$(command -v google-chrome || command -v chromium)" node tests/mir-studio-client-360-browser.cjs
      - name: Hip and flat entrance roof, beam and fascia choices (synthetic only)
        run: MIR_CHROMIUM_BIN="$(command -v google-chrome || command -v chromium)" node tests/mir-studio-entry-assemblies-browser.cjs
      - name: Source-generated masonry, finish choices and reopen (synthetic only)
        run: MIR_CHROMIUM_BIN="$(command -v google-chrome || command -v chromium)" node tests/mir-studio-irregular-masonry-browser.cjs
      - name: Native reading evidence and atomic persistence (synthetic only)
        run: MIR_CHROMIUM_BIN="$(command -v google-chrome || command -v chromium)" node tests/mir-studio-native-reading-store-browser.cjs
      - name: Existing large PDF, rendering and interaction regressions
        run: |
          node tests/mir-plan-pdf-browser.cjs
          node tests/mir-studio-wall-sections-browser.cjs
          node tests/mir-studio-terrain-browser.cjs
      - name: Synthetic proofs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mir-studio-s1-synthetic-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/studio-s1/
            artifacts/studio-s2/
            artifacts/studio-reconstruction/
            artifacts/studio-entry-assemblies/
          if-no-files-found: warn
