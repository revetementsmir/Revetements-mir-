name: MIR Coordination — commande mère, Entrepôt, fournisseurs
on:
  push:
    branches:
      - moon/mir-commandes-coordination-20261107
  pull_request:
    branches:
      - moon/mir-entrepot-qr-inventaire-20261107
    paths:
      - 'dist/coordination.*'
      - 'dist/mir-order-coordination*'
      - 'dist/mir-coordination-client.js'
      - 'dist/entrepot*'
      - 'dist/mir-warehouse-client.js'
      - 'supabase/proposals/202611070007_order_coordination.sql'
      - 'tests/mir-order-coordination*'
      - '.github/workflows/mir-coordination.yml'
permissions:
  contents: read
jobs:
  domain:
    name: Contrats de routage, livraison et notifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node syntax and métier
        run: |
          node --check dist/mir-order-coordination.js
          node --check tests/mir-order-coordination.cjs
          node tests/mir-order-coordination.cjs
