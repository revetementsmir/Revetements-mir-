name: MIR purchase orders and send safety
on:
  pull_request:
    paths: ['dist/mir-po-workflow.js', 'dist/mir-procurement*', 'dist/production*', 'server/**', 'supabase/**', 'tests/mir-po*', 'tests/mir-supplier-send.cjs', 'tools/database/**', '.github/workflows/purchase-orders.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/database/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tools/database
      - run: node tests/mir-database.cjs
      - run: node tests/mir-local-backup.cjs
      - run: node tests/mir-po-workflow.cjs
      - run: node tests/mir-supplier-send.cjs
      - run: node tests/mir-procurement.cjs
