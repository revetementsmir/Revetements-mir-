<!doctype html><html lang="fr-CA"><head><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="script-src 'self' 'sha256-hRy9Lnf/FpCPfejXBIIm0SISrGqk0IQkUbx5rlXtbQc='; object-src 'none'; base-uri 'none'; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIR — Réception fournisseur → inventaire</title><style>
:root{--bg:#0b100d;--card:#121914;--line:#2c3b31;--text:#f1f6f2;--muted:#93a399;--accent:#b9ff42}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}h1{margin:4px 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field span,.muted{color:var(--muted);font-size:12px}input,select,button,textarea{border:1px solid var(--line);background:#0a0f0c;color:var(--text);border-radius:9px;padding:10px;font:inherit}button{font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#0b100d}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:1.4fr .7fr .7fr 1fr;gap:8px;align-items:center;border:1px solid var(--line);padding:9px;border-radius:10px}.ok{color:#c6f9c9}.warn{color:#ffe1a5}@media(max-width:700px){.grid,.row{grid-template-columns:1fr}}</style>
<style id="mir-responsive-hardening">

p,li,label,.muted,.notice,.card{overflow-wrap:anywhere}
input,select,textarea,button,[role="button"]{font:inherit;max-width:100%}
button,[role="button"],input[type="button"],input[type="submit"],input[type="reset"],select{min-height:44px;touch-action:manipulation}

</head><body><aside style="padding:12px;background:#f3e8cf;color:#261e0e;font:16px system-ui"><a href="index.html">Retour aux essais MIR</a> · Démonstration locale. Utilisez des données fictives.</aside><main class="wrap"><div class="muted">MIR · ADMIN · RÉCEPTION</div><h1>Réception fournisseur → inventaire</h1><section class="card"><p class="muted">Les lignes Chantier restent au chantier. Seules les lignes Inventaire créditent le stock général, une seule fois par reçu/packing slip.</p><div class="grid"><label class="field"><span>Bon fournisseur JSON</span><textarea id="poJson" rows="7"></textarea></label><label class="field"><span>Inventaire magasin JSON</span><textarea id="storeJson" rows="7"></textarea></label></div><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button id="load">Analyser</button><button id="apply" class="primary">Comptabiliser en inventaire</button></div></section><section class="card"><div class="grid"><label class="field"><span>Réception / BL</span><select id="receipt"></select></label><label class="field"><span>État</span><div id="state" class="muted">Chargez un bon.</div></label></div><div id="lines" class="rows" style="margin-top:12px"></div></section><section class="card"><h3>Résultat inventaire</h3><textarea id="result" rows="10" readonly></textarea></section></main><script src="./supplier-purchase-order.js"></script><script type="module">
import { inventoryReceiptPlan, applySupplierReceiptToInventory } from './supplier-inventory-sync.js';
const $=id=>document.getElementById(id); let po=null, store=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parse(){po=window.MIRSupplierPO.restore($('poJson').value);store=JSON.parse($('storeJson').value);$('receipt').innerHTML=(po.receipts||[]).map(r=>`<option value="${esc(r.id)}">${esc(r.packingSlip||r.id)} · ${esc(r.at||'')}</option>`).join('');render()}
function mappings(){const out={};document.querySelectorAll('[data-map]').forEach(el=>{if(el.value.trim())out[el.dataset.map]=el.value.trim()});return out}
function render(){if(!po)return;try{const plan=inventoryReceiptPlan(po,$('receipt').value,{mappings:mappings()});$('state').innerHTML=`<span class="ok">${plan.credits.length} ligne(s) inventaire</span> · ${plan.chantier.length} ligne(s) chantier`;$('lines').innerHTML=[...plan.credits.map(x=>`<div class="row"><b>${esc(x.lineId)} · ${esc(x.quantity)} ${esc(x.unit)}</b><span>Inventaire</span><input data-map="${esc(x.lineId)}" value="${esc(x.itemId)}" placeholder="SKU inventaire"><span>${esc(x.supplierName)}</span></div>`),...plan.chantier.map(x=>`<div class="row"><b>${esc(x.lineId)} · ${esc(x.quantity)} ${esc(x.unit)}</b><span>Chantier</span><span>${esc(x.chantier)}</span><span>Pas de crédit stock</span></div>`)].join('');document.querySelectorAll('[data-map]').forEach(el=>el.oninput=render)}catch(e){$('state').textContent=e.message;const receipt=(po.receipts||[]).find(r=>r.id===$('receipt').value);$('lines').innerHTML=(receipt?.items||[]).map(item=>{const line=(po.lines||[]).find(l=>l.id===item.lineId);if(line?.destination==='inventory')return `<div class="row"><b>${esc(line.id)} · ${esc(line.description)}</b><span>Inventaire</span><input data-map="${esc(line.id)}" value="${esc(line.inventoryItemId||'')}" placeholder="SKU inventaire requis"><span class="warn">Mapping requis</span></div>`;return `<div class="row"><b>${esc(line?.id)} · ${esc(line?.description)}</b><span>Chantier</span><span>${esc(po.project?.chantier||'')}</span><span>Pas de stock</span></div>`}).join('');document.querySelectorAll('[data-map]').forEach(el=>el.oninput=render)}}
$('load').onclick=()=>{try{parse()}catch(e){$('state').textContent=e.message}};$('receipt').onchange=render;$('apply').onclick=()=>{try{const r=applySupplierReceiptToInventory(store,po,$('receipt').value,{mappings:mappings(),actorRole:'admin'});store=r.store;$('storeJson').value=JSON.stringify(store,null,2);$('result').value=JSON.stringify({applied:r.applied,inventory:store.inventory},null,2);render()}catch(e){$('state').textContent=e.message}};
</script></body></html>
