<!doctype html><html lang="fr-CA"><head><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="script-src 'self' 'sha256-WyW37GZ8b7nmvM4cit2w8la2nj6a72sJ0MTlB3bKNTw='; object-src 'none'; base-uri 'none'; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIR — File atelier</title><style>
:root{--bg:#0e1110;--card:#171c19;--line:#34413a;--text:#f4f7f5;--muted:#9aa8a0;--accent:#b8ff3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:20px}.notice{padding:10px;border:1px solid #33513d;background:#101713;border-radius:10px;color:#cad6ce}.row{display:flex;gap:8px;flex-wrap:wrap}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}.job{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.head{display:flex;justify-content:space-between;gap:10px}.muted{color:var(--muted)}button,input,select{font:inherit}button{border:1px solid var(--line);background:#121714;color:white;border-radius:8px;padding:8px 10px;font-weight:700}.primary{background:var(--accent);color:#10170d;border-color:var(--accent)}input,select{background:#0d1210;color:white;border:1px solid var(--line);border-radius:8px;padding:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
<style id="mir-responsive-hardening">
/* MIR_RESPONSIVE_V1 — shared candidate contract */
html,body{width:100%;max-width:100%;overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box}
body{min-width:0}
main,.wrap,.container,.shell,.card,.panel,.section,.notice,.dispatch{min-width:0;max-width:100%}
.grid>*,.layout>*,.form-grid>*,.fields>*,.field-grid>*,.summary-grid>*,.stats>*,.kpis>*{min-width:0}
img,svg,canvas,video{max-width:100%;height:auto}
p,li,label,.muted,.notice,.card{overflow-wrap:anywhere}
input,select,textarea,button,[role="button"]{font:inherit;max-width:100%}
button,[role="button"],input[type="button"],input[type="submit"],input[type="reset"],select{min-height:44px;touch-action:manipulation}
pre,code{max-width:100%;overflow-x:auto}
table{max-width:100%}
.table-wrap,[data-table-wrap]{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (pointer:coarse){
  button,[role="button"],input[type="button"],input[type="submit"],input[type="reset"],select{min-height:44px}
}
@media (max-width:760px){
  body{overflow-x:hidden}
  main,.wrap,.container,.shell{width:100%;max-width:100%;padding-left:12px!important;padding-right:12px!important}
  .grid,.layout,.form-grid,.fields,.field-grid,.summary-grid,.stats,.kpis{grid-template-columns:minmax(0,1fr)!important}
  .row,.actions,.toolbar,.button-row,.controls{flex-wrap:wrap!important;max-width:100%}
  .actions>button,.toolbar>button,.button-row>button,.controls>button{flex:1 1 140px}
  table{display:block;width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  th,td{white-space:nowrap}
  input:not([type="checkbox"]):not([type="radio"]),select,textarea{width:100%;min-width:0}
  dialog{width:calc(100vw - 24px);max-width:calc(100vw - 24px);margin:12px}
  pre{max-height:55vh}
  .card,.notice,.dispatch{max-width:100%}
  h1{font-size:clamp(22px,7vw,32px);line-height:1.1}
  h2{font-size:clamp(18px,5.5vw,24px);line-height:1.15}
}
@media (max-width:430px){
  main,.wrap,.container,.shell{padding-left:10px!important;padding-right:10px!important}
  .card,.notice,.dispatch{padding:12px!important}
  .actions>button,.toolbar>button,.button-row>button,.controls>button,.row>button{flex:1 1 100%}
  .row>input,.row>select,.row>textarea{flex:1 1 100%;width:100%}
}
</style>
</head><body><aside style="padding:12px;background:#f3e8cf;color:#261e0e;font:16px system-ui"><a href="index.html">Retour aux essais MIR</a> · Démonstration locale. Utilisez des données fictives.</aside><div class="wrap"><h1>MIR · File atelier</h1><div class="notice">Candidate locale. La file réelle devra être protégée côté serveur dans le backend MIR. Aucun employé réel ni production réelle n’est modifié ici.</div><div class="card"><div class="row"><button id="loadRelease" class="primary">Charger dernière libération</button><input id="search" placeholder="Rechercher pièce/chantier"><select id="status"><option value="">Tous</option><option>queued</option><option>in_progress</option><option>partial</option><option>completed</option><option>cancelled</option></select></div><div id="summary" class="muted"></div></div><div class="grid"><section class="card"><h2>Travaux</h2><div id="jobs"></div></section><aside class="card"><h2>État</h2><pre id="out"></pre></aside></div></div><script src="workshop-queue.js"></script><script>
const W=window.MIRWorkshopQueue,$=id=>document.getElementById(id),STORE='mir:workshop-queue:candidate-v1',PROD='mir:production-batch:candidate-v1';let state=null;function save(){localStorage.setItem(STORE,W.serialize(state))}function render(msg=''){const jobs=W.listJobs(state,{status:$('status').value,query:$('search').value});$('summary').textContent=msg||`${jobs.length} tâche(s) affichée(s)`;$('jobs').innerHTML=jobs.map(j=>`<div class="job"><div class="head"><b>${j.description}</b><span>${j.status}</span></div><div class="muted">${j.chantierName||j.chantierId} · ${j.material} ${j.gauge} · ${j.color}<br>Produit ${j.quantityCompleted}/${j.quantityRequested} · assigné ${j.assignedTo||'—'}</div><div class="row"><input data-user="${j.id}" placeholder="Employé" value="${j.assignedTo||''}"><button data-assign="${j.id}">Assigner</button><button data-start="${j.id}">Démarrer</button><input data-qty="${j.id}" type="number" min="0.01" step="0.01" placeholder="Qté"><button data-prod="${j.id}" class="primary">Produire</button><button data-cancel="${j.id}">Annuler</button></div></div>`).join('')||'<div class="muted">Aucune tâche.</div>';$('out').textContent=W.serialize(state);document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>{try{const id=b.dataset.assign,u=document.querySelector(`[data-user="${id}"]`).value;state=W.assignJob(state,{jobId:id,userId:u,actorRole:'admin'},{expectedRevision:state.revision});save();render('Assignation enregistrée localement.')}catch(e){render(e.message)}});document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{try{const id=b.dataset.start,u=document.querySelector(`[data-user="${id}"]`).value;state=W.startJob(state,{jobId:id,userId:u},{expectedRevision:state.revision});save();render('Tâche démarrée.')}catch(e){render(e.message)}});document.querySelectorAll('[data-prod]').forEach(b=>b.onclick=()=>{try{const id=b.dataset.prod,u=document.querySelector(`[data-user="${id}"]`).value,q=Number(document.querySelector(`[data-qty="${id}"]`).value);state=W.recordProduction(state,{jobId:id,quantity:q,idempotencyKey:`ui:${id}:${state.revision}:${q}`,userId:u},{expectedRevision:state.revision});save();render('Production enregistrée sans double comptage.')}catch(e){render(e.message)}});document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{try{state=W.cancelJob(state,{jobId:b.dataset.cancel,reason:'Annulation admin',actorRole:'admin'},{expectedRevision:state.revision});save();render('Tâche annulée.')}catch(e){render(e.message)}})}
$('loadRelease').onclick=()=>{try{const raw=localStorage.getItem(PROD);if(!raw)throw new Error('Aucun dossier production local.');const b=JSON.parse(raw),rel=b.releases?.at(-1);if(!rel)throw new Error('Aucune libération production.');state=W.enqueueRelease(state,rel,{expectedRevision:state.revision,actorRole:'admin'});save();render('Libération chargée dans la file atelier sans doublon.')}catch(e){render(e.message)}};$('search').oninput=()=>render();$('status').onchange=()=>render();try{state=W.restore(localStorage.getItem(STORE)||'')}catch{state=W.createWorkshopQueue({organizationId:'MIR'})}render();
</script></body></html>
