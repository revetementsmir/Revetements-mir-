<!doctype html><html lang="fr"><head><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="script-src 'self' 'sha256-GQGBKRmAMLu3y+/IdXk9uxGkcc7xyyNFbq/k4mj+0Xk='; object-src 'none'; base-uri 'none'; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIR — Annotations façades</title><style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#111;color:#eee}*{box-sizing:border-box}body{margin:0;background:#111;color:#eee}.app{max-width:1180px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px}.card{border:1px solid #333;border-radius:14px;padding:16px;background:#181818}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{display:grid;gap:6px;font-size:13px}input,select,textarea,button{font:inherit;border:1px solid #444;background:#202020;color:#eee;border-radius:9px;padding:10px}button{cursor:pointer}.elevation{position:relative;aspect-ratio:16/9;background:#222;border:1px dashed #555;border-radius:12px;overflow:hidden}.pin{position:absolute;transform:translate(-50%,-50%);border:2px solid #eee;border-radius:999px;width:28px;height:28px;display:grid;place-items:center;font-size:10px;background:#333}.warn{padding:9px;border:1px solid #665;border-radius:8px;background:#282418}.ok{padding:9px;border:1px solid #365;border-radius:8px;background:#17231b}.muted{color:#aaa;font-size:12px}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #333;text-align:left;padding:8px;font-size:12px}
/* MIR_RESPONSIVE_V1 */
html,body{width:100%;max-width:100%;overflow-x:hidden}
img,svg,canvas,video,.card,.panel,.elevation{max-width:100%}
button,a,input,select,textarea,[role="button"]{min-height:44px;touch-action:manipulation}
@media (max-width:760px){.app{padding:12px}.grid{grid-template-columns:minmax(0,1fr)!important}.row{align-items:stretch}.row>*{min-width:0}input:not([type="checkbox"]):not([type="radio"]),select,textarea{width:100%;min-width:0}table{display:block;width:100%;max-width:100%;overflow-x:auto}.card{padding:12px}dialog{max-width:calc(100vw - 24px);max-height:calc(100vh - 24px)}}
@media (max-width:430px){.row>button,.row>a{flex:1 1 100%;width:100%}.row>input,.row>select,.row>textarea{flex:1 1 100%;width:100%}}
</style></head><body><aside style="padding:12px;background:#f3e8cf;color:#261e0e;font:16px system-ui"><a href="index.html">Retour aux essais MIR</a> · Démonstration locale. Utilisez des données fictives.</aside><main class="app"><h1>Annotations façades</h1><p class="muted">Candidate locale. Les mêmes IDs sont utilisés dans le PDF chantier et le PDF complet.</p><div class="grid"><section class="card"><h2>Ajouter une annotation</h2><div class="row"><label>Élévation<select id="elevation"><option value="front">Avant</option><option value="back">Arrière</option><option value="left">Gauche</option><option value="right">Droite</option></select></label><label>Type<select id="kind"><option value="note">Note</option><option value="window_l">L fenêtre</option><option value="window_drip">Goutte d’eau</option><option value="departure">Départ</option><option value="rodent_guard">Anti-rongeur</option><option value="corner">Coin</option><option value="soffit_j">J soffite</option><option value="panel_joint">Joint panneau</option><option value="masonry_meeting">Rencontre brique</option><option value="roof_l">L au-dessus toiture</option></select></label></div><label>Texte court<input id="shortText" value="L fenêtre"></label><label>Couleur indépendante / explicite<input id="colorRef" placeholder="ex. Noir fenêtre"></label><div class="row"><label>X (0–1)<input id="x" type="number" min="0" max="1" step="0.01" value="0.25"></label><label>Y (0–1)<input id="y" type="number" min="0" max="1" step="0.01" value="0.45"></label></div><div class="row"><label>Longueur coin (po)<input id="length" type="number" min="0" step="0.125"></label><label>Rive<select id="edgeRole"><option value="">—</option><option value="soffit">Soffite</option><option value="fascia">Fascia</option></select></label></div><label><input id="support" type="checkbox"> Géométrie support confirmée</label><label><input id="cladding" type="checkbox"> Règle revêtement confirmée</label><label><input id="scenario" type="checkbox"> Scénario toiture confirmé</label><button id="add">Ajouter</button><div id="status" class="muted"></div></section><section class="card"><h2>Élévation</h2><div class="elevation" id="canvas"></div><h2>Annotations</h2><table><thead><tr><th>ID</th><th>Type</th><th>Élévation</th><th>Texte</th><th>État</th></tr></thead><tbody id="rows"></tbody></table><div class="row"><button id="chantier">Aperçu PDF chantier</button><button id="full">Aperçu PDF complet</button></div><pre id="document" class="muted"></pre></section></div></main><script type="module">
import {createFacadeAnnotationSet,addFacadeAnnotation,buildFacadeDocumentModel} from './facade-annotations.js';
let set=createFacadeAnnotationSet({id:'FAS-DEMO',chantierId:'CHANTIER-DEMO',title:'Annotations façades',createdBy:'MIR admin'});
const $=id=>document.getElementById(id);function render(){const rows=$('rows');rows.innerHTML='';$('canvas').innerHTML='';for(const a of set.annotations){const tr=document.createElement('tr');tr.innerHTML=`<td>${a.id}</td><td>${a.kind}</td><td>${a.elevationId}</td><td>${a.shortText}</td><td>${a.rule.blocked?'Bloqué':'OK'}</td>`;rows.appendChild(tr);if(a.elevationId===$('elevation').value){const pin=document.createElement('div');pin.className='pin';pin.style.left=(a.anchor.x*100)+'%';pin.style.top=(a.anchor.y*100)+'%';pin.textContent=a.id.replace(/^A/,'');pin.title=a.shortText;$('canvas').appendChild(pin)}}}
$('add').onclick=()=>{try{set=addFacadeAnnotation(set,{kind:$('kind').value,elevationId:$('elevation').value,anchor:{x:Number($('x').value),y:Number($('y').value)},shortText:$('shortText').value,colorRef:$('colorRef').value,totalLinearIn:$('length').value||null,edgeRole:$('edgeRole').value,supportGeometryKnown:$('support').checked,claddingRuleConfirmed:$('cladding').checked,scenarioConfirmed:$('scenario').checked},{expectedRevision:set.revision,actor:'MIR admin'});$('status').className='ok';$('status').textContent='Annotation ajoutée';render()}catch(e){$('status').className='warn';$('status').textContent=e.message}};
$('elevation').onchange=render;$('chantier').onclick=()=>{$('document').textContent=JSON.stringify(buildFacadeDocumentModel(set,{audience:'chantier'}),null,2)};$('full').onclick=()=>{$('document').textContent=JSON.stringify(buildFacadeDocumentModel(set,{audience:'full'}),null,2)};render();
</script></body></html>
