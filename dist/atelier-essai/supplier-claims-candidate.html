<!doctype html><html lang="fr-CA"><head><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="script-src 'self' 'sha256-H3vY4WqxUZZVUyT+hnuv2o3SLEH1YY4bkX+sBYXB654='; object-src 'none'; base-uri 'none'; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIR — Réclamations fournisseurs</title><style>
:root{--bg:#0b100d;--card:#121914;--line:#2c3b31;--text:#f1f6f2;--muted:#93a399;--accent:#b9ff42;--danger:#ffb1a7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{display:grid;gap:5px;color:var(--muted)}input,select,textarea,button{background:#090e0b;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}button{font-weight:800}.primary{background:var(--accent);color:#081008}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.muted{color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto}.danger{color:var(--danger)}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
<style id="mir-responsive-hardening">
/* MIR_RESPONSIVE_V1 — shared candidate contract */
html,body{width:100%;max-width:100%;overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box}
body{min-width:0}
main,.wrap,.container,.shell,.card,.panel,.section,.notice,.dispatch{min-width:0;max-width:100%}
.grid>*,.layout>*,.form-grid>*,.fields>*,.field-grid>*,.summary-grid>*,.stats>*,.kpis>*{min-width:0}
img,svg,canvas,video{max-width:100%;height:auto}
p,li,label,.muted,.notice,.card{overflow-wrap:anywhere}
input,select,textarea,button,[role="button"]{font:inherit;max-width:100%}
button,[role="button"],input[type="button"],input[type="submit"],input[type="reset"],select{min-height:44px;touch-action:manipulation}
pre,code{max-width:100%;overflow-x:auto}
table{max-width:100%}
.table-wrap,[data-table-wrap]{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (pointer:coarse){
  button,[role="button"],input[type="button"],input[type="submit"],input[type="reset"],select{min-height:44px}
}
@media (max-width:760px){
  body{overflow-x:hidden}
  main,.wrap,.container,.shell{width:100%;max-width:100%;padding-left:12px!important;padding-right:12px!important}
  .grid,.layout,.form-grid,.fields,.field-grid,.summary-grid,.stats,.kpis{grid-template-columns:minmax(0,1fr)!important}
  .row,.actions,.toolbar,.button-row,.controls{flex-wrap:wrap!important;max-width:100%}
  .actions>button,.toolbar>button,.button-row>button,.controls>button{flex:1 1 140px}
  table{display:block;width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  th,td{white-space:nowrap}
  input:not([type="checkbox"]):not([type="radio"]),select,textarea{width:100%;min-width:0}
  dialog{width:calc(100vw - 24px);max-width:calc(100vw - 24px);margin:12px}
  pre{max-height:55vh}
  .card,.notice,.dispatch{max-width:100%}
  h1{font-size:clamp(22px,7vw,32px);line-height:1.1}
  h2{font-size:clamp(18px,5.5vw,24px);line-height:1.15}
}
@media (max-width:430px){
  main,.wrap,.container,.shell{padding-left:10px!important;padding-right:10px!important}
  .card,.notice,.dispatch{padding:12px!important}
  .actions>button,.toolbar>button,.button-row>button,.controls>button,.row>button{flex:1 1 100%}
  .row>input,.row>select,.row>textarea{flex:1 1 100%;width:100%}
}
</style>
</head><body><aside style="padding:12px;background:#f3e8cf;color:#261e0e;font:16px system-ui"><a href="index.html">Retour aux essais MIR</a> · Démonstration locale. Utilisez des données fictives.</aside><main class="wrap"><div class="muted">MIR · ACHATS · FOURNISSEURS</div><h1>Réclamations fournisseur</h1><section class="card"><p class="muted">Les quantités refusées/endommagées restent dues par le fournisseur. Elles ne sont jamais comptées comme reçues ni ajoutées en inventaire.</p><div class="grid"><label>Réception<select id="receipt"></select></label><label>Ligne<select id="line"></select></label><label>Quantité réclamée<input id="qty" inputmode="decimal"></label><label>Motif<input id="reason" placeholder="Endommagé, mauvaise couleur..."></label><label>Ouvert par<input id="createdBy"></label><label>No réclamation fournisseur<input id="claimNumber"></label></div><div class="actions"><button id="create" class="primary">Ouvrir réclamation</button></div></section><section class="card"><div class="grid"><label>Réclamation<select id="claim"></select></label><label>Référence fournisseur<input id="resolutionRef" placeholder="RA / autorisation"></label><label>Quantité remplacement<input id="replacementQty" inputmode="decimal"></label><label>No note de crédit<input id="creditMemo"></label><label>Montant crédit<input id="creditAmount" inputmode="decimal"></label><label>Traité par<input id="resolvedBy"></label></div><div class="actions"><button id="send">Envoyer réclamation</button><button id="replacement">Autoriser remplacement</button><button id="credit">Fermer par crédit</button></div><p id="sendState" class="muted"></p></section><section class="card"><h2>État</h2><pre id="state"></pre></section></main><script src="./supplier-purchase-order.js"></script><script src="./supplier-send-supabase-adapter.js"></script><script>
const P=window.MIRSupplierPO, SA=window.MIRSupplierSupabaseAdapter, STORE='mir:supplier-po:candidate-v1', $=id=>document.getElementById(id);let po=null;
if(!window.MIRSupplierSendProvider&&window.MIRSupabaseClient&&SA){try{window.MIRSupplierSendProvider=SA.createSupplierSendProvider(window.MIRSupabaseClient,{functionName:'mir-send-supplier-po'})}catch{}}
function save(){localStorage.setItem(STORE,P.serialize(po));render()}
function load(){const raw=localStorage.getItem(STORE);if(!raw)throw new Error('Aucun bon fournisseur courant.');po=P.restore(raw)}
function render(){const receipts=po?.receipts||[];$('receipt').innerHTML=receipts.map(r=>`<option value="${r.id}">${r.packingSlip||r.id}</option>`).join('');const rid=$('receipt').value||receipts[0]?.id||'';const receipt=receipts.find(r=>r.id===rid);$('line').innerHTML=(receipt?.items||[]).filter(i=>Number(i.rejectedQuantity)>0).map(i=>`<option value="${i.lineId}">${i.lineId} · refusé ${i.rejectedQuantity}</option>`).join('');const claims=P.claimSummary(po).claims;$('claim').innerHTML=claims.map(c=>`<option value="${c.id}">${c.id} · ${c.status} · ${c.quantity}</option>`).join('');$('state').textContent=JSON.stringify({poNumber:po.poNumber,revision:po.revision,summary:P.receiptSummary(po),claims:P.claimSummary(po)},null,2)}
$('receipt').onchange=render;
$('create').onclick=()=>{try{po=P.createSupplierClaim(po,{receiptId:$('receipt').value,lineId:$('line').value,quantity:$('qty').value,reason:$('reason').value,createdBy:$('createdBy').value,claimNumber:$('claimNumber').value});save()}catch(e){$('sendState').textContent=e.message}};
$('send').onclick=async()=>{try{const req=P.prepareClaimNotice(po,$('claim').value);const provider=window.MIRSupplierSendProvider;if(typeof provider!=='function')throw new Error('Service courriel MIR non connecté. Réclamation non envoyée.');const r=await P.dispatchClaimNotice(po,req,provider);po=r.po;$('sendState').textContent=r.duplicate?'Réclamation déjà envoyée; aucun doublon.':'Réclamation envoyée avec preuve.';save()}catch(e){$('sendState').textContent=e.message}};
$('replacement').onclick=()=>{try{po=P.authorizeClaimReplacement(po,$('claim').value,{quantity:$('replacementQty').value,reference:$('resolutionRef').value,authorizedBy:$('resolvedBy').value});save()}catch(e){$('sendState').textContent=e.message}};
$('credit').onclick=()=>{try{po=P.resolveClaimWithCredit(po,$('claim').value,{creditMemoNumber:$('creditMemo').value,amount:$('creditAmount').value,resolvedBy:$('resolvedBy').value,proof:$('resolutionRef').value});save()}catch(e){$('sendState').textContent=e.message}};
try{load();render()}catch(e){$('state').textContent=e.message}
</script></body></html>
