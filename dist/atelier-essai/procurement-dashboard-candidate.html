</head><body><aside style="padding:12px;background:#f3e8cf;color:#261e0e;font:16px system-ui"><a href="index.html">Retour aux essais MIR</a> · Démonstration locale. Utilisez des données fictives.</aside><main class="wrap"><div class="muted">MIR · ACHATS</div><h1>Suivi fournisseurs</h1><section class="grid" id="metrics"></section><h2>À traiter</h2><section class="attention" id="attention"></section><p class="muted">Les factures « approuvées pour comptabilité » ne sont pas payées par ce module.</p></main><script src="./supplier-purchase-order.js"></script><script src="./supplier-po-register.js"></script><script src="./supplier-invoices.js"></script><script src="./procurement-dashboard.js"></script><script>
