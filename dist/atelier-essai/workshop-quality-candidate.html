</head><body><aside style="padding:12px;background:#f3e8cf;color:#261e0e;font:16px system-ui"><a href="index.html">Retour aux essais MIR</a> · Démonstration locale. Utilisez des données fictives.</aside><div class="wrap"><h1>MIR · Contrôle qualité atelier</h1><div class="notice">Candidate locale. Le contrôle qualité réel doit être associé à l’identité authentifiée de l’inspecteur côté serveur.</div><div class="card"><label>Inspecteur <input id="inspector" placeholder="Identité"></label><div id="summary" class="muted"></div></div><div id="jobs"></div><pre id="out" class="card"></pre></div><script src="workshop-quality.js"></script><script>
const Q=window.MIRWorkshopQuality,$=id=>document.getElementById(id),QKEY='mir:workshop-quality:candidate-v1',WKEY='mir:workshop-queue:candidate-v1';let state;function loadJobs(){try{return JSON.parse(localStorage.getItem(WKEY)||'{}').jobs||[]}catch{return[]}}function save(){localStorage.setItem(QKEY,Q.serialize(state))}function render(msg=''){const jobs=loadJobs().filter(j=>j.status==='completed');$('jobs').innerHTML=jobs.map(j=>{const r=Q.latestReview(state,j.id);const keys=Q.requiredChecks(j);return `<div class="job"><b>${j.description}</b> <span class="muted">${j.itemId}</span><div class="checks">${keys.map(k=>`<label><input type="checkbox" data-check="${j.id}:${k}" ${r?.checks?.[k]?'checked':''}> ${k}</label>`).join('')}</div><div class="row"><input data-note="${j.id}" placeholder="Note"><button data-fail="${j.id}">À reprendre</button><button data-pass="${j.id}" class="ok">Approuver</button></div><div class="${r?.passed?'muted':'warn'}">${r?`${r.status} · ${r.inspectorId}`:'Non contrôlé'}</div></div>`}).join('')||'<div class="notice">Aucune tâche atelier terminée à contrôler.</div>';const releases=[...new Set(jobs.map(j=>j.releaseId))];$('summary').textContent=msg||releases.map(id=>{const s=Q.releaseQualitySummary(state,loadJobs(),id);return `${id}: ${s.readyForDispatch?'prêt à expédier':`${s.unreviewed} non contrôlé(s), ${s.failed} à reprendre`}`}).join(' · ');$('out').textContent=Q.serialize(state);document.querySelectorAll('[data-pass],[data-fail]').forEach(b=>b.onclick=()=>{try{const job=jobs.find(j=>j.id===(b.dataset.pass||b.dataset.fail));const inspector=$('inspector').value.trim();const checks={};for(const k of Q.requiredChecks(job))checks[k]=document.querySelector(`[data-check="${job.id}:${k}"]`).checked;const input={inspectorId:inspector,passed:!!b.dataset.pass,checks,note:document.querySelector(`[data-note="${job.id}"]`).value};const prev=Q.latestReview(state,job.id);state=prev?Q.supersedeReview(state,job,input,{expectedRevision:state.revision}):Q.reviewJob(state,job,input,{expectedRevision:state.revision});save();render(input.passed?'Contrôle approuvé.':'Pièce marquée à reprendre.')}catch(e){render(e.message)}})}try{state=Q.restore(localStorage.getItem(QKEY)||'')}catch{state=Q.createQualityState({organizationId:'MIR'})}render();
</script></body></html>
