<!doctype html><html lang="fr-CA"><head><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="script-src 'self' 'sha256-x4hn/Ttz5g1kMQGYRZL4MdjCCgaqWbSh/Dvt99zWzAQ='; object-src 'none'; base-uri 'none'; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIR — Livraison atelier</title><style>body{margin:0;background:#0e1110;color:#f4f7f5;font:14px system-ui}.wrap{max-width:1080px;margin:auto;padding:20px}.card,.notice{border:1px solid #34413a;background:#171c19;border-radius:12px;padding:12px;margin:10px 0}.notice{background:#101713}.row{display:flex;gap:8px;flex-wrap:wrap}.dispatch{border:1px solid #34413a;border-radius:9px;padding:10px;margin:8px 0}input,select,button{font:inherit}input,select{background:#0d1210;color:#fff;border:1px solid #34413a;border-radius:7px;padding:7px}button{border:1px solid #34413a;background:#121714;color:#fff;border-radius:8px;padding:8px 10px;font-weight:700}.primary{background:#b8ff3d;color:#10170d}.muted{color:#9ca9a1}</style>
<style id="mir-responsive-hardening">
/* MIR_RESPONSIVE_V1 — shared candidate contract */
html,body{width:100%;max-width:100%;overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box}
body{min-width:0}
main,.wrap,.container,.shell,.card,.panel,.section,.notice,.dispatch{min-width:0;max-width:100%}
.grid>*,.layout>*,.form-grid>*,.fields>*,.field-grid>*,.summary-grid>*,.stats>*,.kpis>*{min-width:0}
img,svg,canvas,video{max-width:100%;height:auto}
p,li,label,.muted,.notice,.card{overflow-wrap:anywhere}
input,select,textarea,button,[role="button"]{font:inherit;max-width:100%}
button,[role="button"],input[type="button"],input[type="submit"],input[type="reset"],select{min-height:44px;touch-action:manipulation}
pre,code{max-width:100%;overflow-x:auto}

.table-wrap,[data-table-wrap]{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (pointer:coarse){
  button,[role="button"],input[type="button"],input[type="submit"],input[type="reset"],select{min-height:44px}
}
@media (max-width:760px){
  body{overflow-x:hidden}

  .grid,.layout,.form-grid,.fields,.field-grid,.summary-grid,.stats,.kpis{grid-template-columns:minmax(0,1fr)!important}

</head><body><aside style="padding:12px;background:#f3e8cf;color:#261e0e;font:16px system-ui"><a href="index.html">Retour aux essais MIR</a> · Démonstration locale. Utilisez des données fictives.</aside><div class="wrap"><h1>MIR · Livraison / ramassage</h1><div class="notice">Candidate locale. Une expédition réelle doit utiliser les identités et preuves serveur MIR; aucune livraison réelle n’est modifiée ici.</div><div class="card"><div class="row"><button id="createDispatch" class="primary">Créer depuis dernière libération QC</button><select id="mode"><option value="delivery">Livraison</option><option value="pickup">Ramassage</option></select><input id="destination" placeholder="Destination"><input id="date" type="date"></div></div><div id="dispatches"></div><pre id="out" class="card"></pre></div><script src="workshop-dispatch.js"></script><script src="workshop-quality.js"></script><script>
const D=window.MIRWorkshopDispatch,Q=window.MIRWorkshopQuality,$=id=>document.getElementById(id),DKEY='mir:workshop-dispatch:candidate-v1',PKEY='mir:production-batch:candidate-v1',WKEY='mir:workshop-queue:candidate-v1',QKEY='mir:workshop-quality:candidate-v1';let state;function save(){localStorage.setItem(DKEY,D.serialize(state))}function read(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}function render(msg=''){const list=state.dispatches||[];$('dispatches').innerHTML=list.map(x=>`<div class="dispatch"><b>${x.chantierName||x.chantierId} · ${x.status}</b><div class="muted">${x.mode} · ${x.scheduledDate||'date à confirmer'} · ${x.destination||'ramassage atelier'}<br>${x.items.length} ligne(s) · libération #${x.releaseNumber}</div><div class="row"><input data-driver="${x.id}" placeholder="Chauffeur" value="${x.driver||''}"><input data-vehicle="${x.id}" placeholder="Véhicule" value="${x.vehicle||''}"><button data-plan="${x.id}">Planifier</button><button data-pack="${x.id}">Préparer</button><button data-load="${x.id}">Charger</button><input data-rec="${x.id}" placeholder="Reçu par"><input data-proof="${x.id}" placeholder="Preuve"><button data-hand="${x.id}" class="primary">Confirmer remise</button><button data-print="${x.id}">Bordereau</button></div></div>`).join('')||'<div class="notice">Aucune expédition.</div>';$('out').textContent=(msg?msg+'\n':'')+D.serialize(state);document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{try{const id=b.dataset.plan;state=D.updateTransport(state,{dispatchId:id,driver:document.querySelector(`[data-driver="${id}"]`).value,vehicle:document.querySelector(`[data-vehicle="${id}"]`).value,scheduledDate:$('date').value,destination:$('destination').value},{expectedRevision:state.revision,actorRole:'admin'});save();render('Transport mis à jour.')}catch(e){render(e.message)}});document.querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>{try{state=D.markPacked(state,{dispatchId:b.dataset.pack,packedBy:'MIR admin'},{expectedRevision:state.revision});save();render('Expédition préparée.')}catch(e){render(e.message)}});document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{try{state=D.markLoaded(state,{dispatchId:b.dataset.load,loadedBy:'MIR admin'},{expectedRevision:state.revision});save();render('Expédition chargée.')}catch(e){render(e.message)}});document.querySelectorAll('[data-hand]').forEach(b=>b.onclick=()=>{try{const id=b.dataset.hand;state=D.confirmHandoff(state,{dispatchId:id,idempotencyKey:`handoff:${id}:${state.revision}`,receivedBy:document.querySelector(`[data-rec="${id}"]`).value,proofRef:document.querySelector(`[data-proof="${id}"]`).value},{expectedRevision:state.revision});save();render('Remise confirmée avec preuve.')}catch(e){render(e.message)}});document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>{try{const d=state.dispatches.find(x=>x.id===b.dataset.print),w=window.open('','_blank');w.document.write(D.renderPackingList(d));w.document.close();w.print()}catch(e){render(e.message)}})}
$('createDispatch').onclick=()=>{try{const prod=read(PKEY),queue=read(WKEY),qual=read(QKEY);const rel=prod?.releases?.at(-1);if(!rel)throw new Error('Aucune libération production.');const qstate=qual?Q.restore(qual):Q.createQualityState({organizationId:'MIR'});const summary=Q.releaseQualitySummary(qstate,queue?.jobs||[],rel.id);state=D.createDispatch(state,{release:rel,jobs:queue?.jobs||[],qualitySummary:summary,mode:$('mode').value,destination:$('destination').value,scheduledDate:$('date').value,createdBy:'MIR admin'},{expectedRevision:state.revision});save();render('Expédition créée depuis une libération entièrement contrôlée.')}catch(e){render(e.message)}};try{state=D.restore(localStorage.getItem(DKEY)||'')}catch{state=D.createDispatchState({organizationId:'MIR'})}render();
</script></body></html>
