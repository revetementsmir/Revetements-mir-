</head><body><aside style="padding:12px;background:#f3e8cf;color:#261e0e;font:16px system-ui"><a href="index.html">Retour aux essais MIR</a> · Démonstration locale. Utilisez des données fictives.</aside><div class="wrap"><h1>Invitations employés · candidate</h1><p class="warn">Aucun compte ni courriel réel créé ici. Le jeton doit être créé côté serveur et l’envoi doit retourner une preuve réelle.</p><div class="card"><div class="grid"><input id="email" value="employe@example.com" placeholder="Courriel"><input id="chantier" value="C851" placeholder="Chantier"><input id="expires" value="2026-11-05T18:00:00Z" placeholder="Expiration"><input id="serverRef" value="demo-server-ref" placeholder="Référence jeton serveur"></div><button id="create" class="primary">Préparer invitation démo</button> <button id="revoke">Révoquer</button></div><div class="card"><pre id="out"></pre></div><script type="module">import{createInvitationDraft,bindServerToken,revokeInvitation,prepareInvitationSend}from'./employee-invitations.js';const $=id=>document.getElementById(id);let invitation=null;function show(msg=''){ $('out').textContent=msg+'\n'+JSON.stringify(invitation,null,2)}$('create').onclick=()=>{try{invitation=createInvitationDraft({organizationId:'MIR',email:$('email').value,assignedChantiers:[$('chantier').value],expiresAt:$('expires').value,createdBy:'Admin démo',serverAuthorized:true});invitation=bindServerToken(invitation,{serverTokenRef:$('serverRef').value});const req=prepareInvitationSend(invitation);show('Requête prête, NON envoyée. idempotencyKey='+req.idempotencyKey)}catch(e){show(e.message)}};$('revoke').onclick=()=>{try{if(!invitation)throw Error('Aucune invitation');invitation=revokeInvitation(invitation,{serverAuthorized:true});show('Invitation démo révoquée.')}catch(e){show(e.message)}};show();</script></div></body></html>
