</head><body><aside style="padding:12px;background:#f3e8cf;color:#261e0e;font:16px system-ui"><a href="index.html">Retour aux essais MIR</a> · Démonstration locale. Utilisez des données fictives.</aside><main class="wrap"><div class="muted">MIR · INVENTAIRE · ACHATS</div><h1>Réapprovisionnement</h1><section class="card"><p class="muted">MIR prépare seulement des brouillons. Aucun bon n’est envoyé automatiquement et aucun fournisseur/prix manquant n’est inventé.</p><div class="grid"><label>Inventaire magasin JSON<textarea id="store" rows="9"></textarea></label><label>Politiques min/cible JSON<textarea id="policies" rows="9" placeholder='[{"itemId":"A","reorderPoint":5,"targetStock":12,"preferredSupplierId":"..."}]'></textarea></label><label>Répertoire fournisseurs JSON<textarea id="directory" rows="7"></textarea></label><div><button id="analyze">Analyser</button> <button id="build" class="primary">Préparer brouillons</button></div></div></section><section class="card"><pre id="out"></pre></section></main><script src="./supplier-purchase-order.js"></script><script src="./supplier-directory.js"></script><script src="./inventory-reorder.js"></script><script>const $=id=>document.getElementById(id),R=window.MIRInventoryReorder,D=window.MIRSupplierDirectory;function inputs(){return{store:JSON.parse($('store').value),policies:JSON.parse($('policies').value),directory:D.restore($('directory').value)}}$('analyze').onclick=()=>{try{const x=inputs();$('out').textContent=JSON.stringify({needs:R.evaluateReorder(x.store,x.policies)},null,2)}catch(e){$('out').textContent=e.message}};$('build').onclick=()=>{try{const x=inputs(),r=R.buildDraftPurchaseOrders(x.store,x.policies,x.directory);$('out').textContent=JSON.stringify({summary:R.proposalSummary(r),drafts:r.drafts,blocked:r.blocked,unassigned:r.unassigned},null,2)}catch(e){$('out').textContent=e.message}};</script></body></html>
