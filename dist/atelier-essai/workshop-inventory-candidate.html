</head><body><aside style="padding:12px;background:#f3e8cf;color:#261e0e;font:16px system-ui"><a href="index.html">Retour aux essais MIR</a> · Démonstration locale. Utilisez des données fictives.</aside><main class="wrap"><div class="muted">MIR · ATELIER · INVENTAIRE</div><h1>Sortie / retour de matériel atelier</h1><section class="card"><p class="muted">Aucune consommation n’est calculée automatiquement. Chaque quantité est saisie explicitement et liée à une libération + tâche atelier.</p><div class="grid"><label>Libération<input id="releaseId"></label><label>Tâche atelier<input id="jobId"></label><label>Article inventaire<input id="itemId"></label><label>Quantité<input id="quantity" inputmode="decimal"></label><label>Employé<input id="actor"></label><label>Clé opération<input id="key" placeholder="scan, reçu ou UUID"></label></div><div style="display:flex;gap:8px;margin-top:12px"><button id="issue" class="primary">Sortir pour atelier</button><button id="return">Retour inventaire</button></div></section><section class="card"><label>Inventaire JSON<textarea id="store" rows="12"></textarea></label><pre id="state" class="muted"></pre></section></main><script type="module">import{issueWorkshopMaterial,returnWorkshopMaterial,workshopInventorySummary}from'./workshop-inventory.js';const $=id=>document.getElementById(id);let st=null;function data(){return{releaseId:$('releaseId').value,jobId:$('jobId').value,itemId:$('itemId').value,quantity:$('quantity').value,idempotencyKey:$('key').value,actor:$('actor').value,authorized:true}}function load(){st=JSON.parse($('store').value)}function save(r){st=r.store;$('store').value=JSON.stringify(st,null,2);$('state').textContent=JSON.stringify({movement:r,summary:workshopInventorySummary(st,{releaseId:$('releaseId').value,jobId:$('jobId').value})},null,2)}$('issue').onclick=()=>{try{load();save(issueWorkshopMaterial(st,data(),{expectedRevision:st.revision}))}catch(e){$('state').textContent=e.message}};$('return').onclick=()=>{try{load();save(returnWorkshopMaterial(st,data(),{expectedRevision:st.revision}))}catch(e){$('state').textContent=e.message}};</script></body></html>
