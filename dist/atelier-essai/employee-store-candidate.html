</head><body><aside style="padding:12px;background:#f3e8cf;color:#261e0e;font:16px system-ui"><a href="index.html">Retour aux essais MIR</a> · Démonstration locale. Utilisez des données fictives.</aside><div class="wrap"><h1>Magasin employés · candidate</h1><p><a href="../production.html?mode=client&amp;source=store&amp;kind=profile">Ouvrir les modèles de moulures du Magasin employés ↗</a></p><p class="warn">Données fictives locales. Les droits doivent être imposés par le backend/RLS avant activation réelle.</p><div class="card"><h2>Stock</h2><div class="grid"><input id="stock" value="30"><button id="seed" class="primary">Initialiser PRIME 30644</button></div></div><div class="card"><h2>Commande chantier</h2><div class="grid"><input id="qty" value="10"><button id="order">Demander 10 boîtes</button><button id="reserve">Réserver</button><button id="deliver4">Livrer 4</button><button id="deliverRest">Livrer le restant</button></div></div><div class="card"><h2>État</h2><pre id="out"></pre></div><script type="module">import{createStoreState,upsertCatalogItem,adjustStock,createEmployeeOrder,reserveOrder,recordEmployeeDelivery,orderSummary,inventoryView}from'./employee-store-model.js';let s=createStoreState();const $=id=>document.getElementById(id);function show(msg=''){ $('out').textContent=msg+'\n'+JSON.stringify({revision:s.revision,inventory:s.inventory,orders:s.orders.map(o=>({...o,summary:orderSummary(o)}))},null,2)}$('seed').onclick=()=>{try{s=upsertCatalogItem(s,{id:'PRIME30644',name:'Clous PRIME 2 po',unit:'boîte'},{expectedRevision:s.revision});s=adjustStock(s,{itemId:'PRIME30644',delta:Number($('stock').value),idempotencyKey:'seed-stock'},{expectedRevision:s.revision});show('Stock fictif initialisé.')}catch(e){show(e.message)}};$('order').onclick=()=>{try{s=createEmployeeOrder(s,{id:'DEMO-ORDER',organizationId:'MIR',chantierId:'C851',requestedBy:'Employé démo',authorized:true,lines:[{lineId:'L1',itemId:'PRIME30644',quantity:Number($('qty').value)}]},{expectedRevision:s.revision});show('Commande fictive créée.')}catch(e){show(e.message)}};$('reserve').onclick=()=>{try{s=reserveOrder(s,{orderId:'DEMO-ORDER',quantities:{L1:Number($('qty').value)},idempotencyKey:'reserve-demo'},{expectedRevision:s.revision});show('Réservation effectuée une seule fois.')}catch(e){show(e.message)}};$('deliver4').onclick=()=>{try{s=recordEmployeeDelivery(s,{orderId:'DEMO-ORDER',lines:[{lineId:'L1',quantity:4}],idempotencyKey:'delivery-4',deliveredBy:'Admin démo'},{expectedRevision:s.revision});show('Livraison partielle 4.')}catch(e){show(e.message)}};$('deliverRest').onclick=()=>{try{const o=s.orders.find(x=>x.id==='DEMO-ORDER');const remain=orderSummary(o).remaining;s=recordEmployeeDelivery(s,{orderId:'DEMO-ORDER',lines:[{lineId:'L1',quantity:remain}],idempotencyKey:'delivery-rest',deliveredBy:'Admin démo'},{expectedRevision:s.revision});show('Solde livré.')}catch(e){show(e.message)}};show();</script></div></body></html>
