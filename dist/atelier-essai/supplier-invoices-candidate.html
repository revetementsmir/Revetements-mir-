<!doctype html><html lang="fr-CA"><head><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="script-src 'self' 'sha256-SY/ExXDsFGbj2rBcC9Owmacwn7vErkuQ7yjP7tov5Yo='; object-src 'none'; base-uri 'none'; connect-src 'none'; form-action 'none'"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIR — Factures fournisseurs</title><style>body{margin:0;background:#0d1110;color:#eef5f0;font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#151b18;border:1px solid #35423b;border-radius:14px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}input,select,button{background:#0d1210;color:#fff;border:1px solid #3c4b42;border-radius:8px;padding:9px;font:inherit}button{font-weight:700}.primary{background:#b8ff3d;color:#0b1209}.warn{color:#ffd18a}.bad{color:#ff9b9b}.ok{color:#b8ff3d}.muted{color:#9eaaa3}pre{white-space:pre-wrap;overflow:auto}</style>
<style id="mir-responsive-hardening">
/* MIR_RESPONSIVE_V1 — shared candidate contract */
html,body{width:100%;max-width:100%;overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box}
body{min-width:0}
main,.wrap,.container,.shell,.card,.panel,.section,.notice,.dispatch{min-width:0;max-width:100%}
.grid>*,.layout>*,.form-grid>*,.fields>*,.field-grid>*,.summary-grid>*,.stats>*,.kpis>*{min-width:0}
img,svg,canvas,video{max-width:100%;height:auto}
p,li,label,.muted,.notice,.card{overflow-wrap:anywhere}
input,select,textarea,button,[role="button"]{font:inherit;max-width:100%}
button,[role="button"],input[type="button"],input[type="submit"],input[type="reset"],select{min-height:44px;touch-action:manipulation}
pre,code{max-width:100%;overflow-x:auto}
table{max-width:100%}
.table-wrap,[data-table-wrap]{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (pointer:coarse){
  button,[role="button"],input[type="button"],input[type="submit"],input[type="reset"],select{min-height:44px}
}
@media (max-width:760px){
  body{overflow-x:hidden}
  main,.wrap,.container,.shell{width:100%;max-width:100%;padding-left:12px!important;padding-right:12px!important}
  .grid,.layout,.form-grid,.fields,.field-grid,.summary-grid,.stats,.kpis{grid-template-columns:minmax(0,1fr)!important}
  .row,.actions,.toolbar,.button-row,.controls{flex-wrap:wrap!important;max-width:100%}

}

</head><body><aside style="padding:12px;background:#f3e8cf;color:#261e0e;font:16px system-ui"><a href="index.html">Retour aux essais MIR</a> · Démonstration locale. Utilisez des données fictives.</aside><main class="wrap"><div class="muted">MIR · ACHATS</div><h1>Factures fournisseurs</h1><div class="card warn">Rapprochement seulement. Ce module ne paie aucune facture et ne prétend pas synchroniser Zoho. Une facture doit correspondre au bon MIR et aux quantités réellement acceptées.</div><section class="card"><div class="grid"><label>Bon MIR<select id="po"></select></label><label>No facture<input id="invoiceNumber"></label><label>Date facture<input id="invoiceDate" type="date"></label><label>Taxes<input id="tax" inputmode="decimal" value="0"></label><label>Total déclaré<input id="total" inputmode="decimal"></label><label>Approuvé par<input id="approvedBy"></label></div><div id="lines"></div><p><button id="match" class="primary">Rapprocher la facture</button> <button id="approve">Approuver pour comptabilité</button></p></section><section class="card"><h2>Résultat</h2><div id="issues"></div><pre id="out"></pre></section></main><script src="./supplier-purchase-order.js"></script><script src="./supplier-po-register.js"></script><script src="./supplier-invoices.js"></script><script>
const $=id=>document.getElementById(id),POKEY='mir:supplier-po-register:v1',INVKEY='mir:supplier-invoice-register:v1';let currentInvoice=null,currentMatch=null;function poReg(){try{return MIRSupplierPORegister.restore(localStorage.getItem(POKEY)||JSON.stringify(MIRSupplierPORegister.createRegister()))}catch{return MIRSupplierPORegister.createRegister()}}function invReg(){try{return MIRSupplierInvoices.restore(localStorage.getItem(INVKEY)||JSON.stringify(MIRSupplierInvoices.createInvoiceRegister()))}catch{return MIRSupplierInvoices.createInvoiceRegister()}}function selectedPo(){return MIRSupplierPORegister.getOrder(poReg(),$('po').value)}function loadPo(){const po=selectedPo();$('lines').innerHTML=po?(po.lines||[]).map(l=>`<div class="grid card"><b>${l.id} · ${l.description}</b><label>Qté facturée<input data-q="${l.id}" inputmode="decimal"></label><label>Prix unitaire facture<input data-c="${l.id}" inputmode="decimal" value="${l.unitCost??''}"></label></div>`).join(''):'<p class="muted">Choisir un bon.</p>'}function build(){const po=selectedPo();if(!po)throw Error('Choisir un bon MIR.');const lines=(po.lines||[]).map(l=>({poLineId:l.id,description:l.description,quantity:Number(document.querySelector(`[data-q="${l.id}"]`).value||0),unitCost:Number(document.querySelector(`[data-c="${l.id}"]`).value||0)})).filter(l=>l.quantity>0);return MIRSupplierInvoices.createSupplierInvoice({invoiceNumber:$('invoiceNumber').value,supplier:po.supplier,poId:po.id,poNumber:po.poNumber,poRevision:po.revision,currency:po.currency,invoiceDate:$('invoiceDate').value,lines,taxAmount:$('tax').value,statedTotal:$('total').value})}function show(){const issues=currentMatch?.issues||[];$('issues').innerHTML=issues.map(i=>`<div class="${i.severity==='block'?'bad':'warn'}"><b>${i.id}</b> — ${i.message}</div>`).join('')||(currentMatch?'<div class="ok">Aucune anomalie détectée.</div>':'');$('out').textContent=currentMatch?JSON.stringify({match:currentMatch,invoice:currentInvoice},null,2):''}function init(){const r=poReg();$('po').innerHTML='<option value="">— Choisir —</option>'+MIRSupplierPORegister.listOrders(r,{includeRevised:false,includeCancelled:false}).map(p=>`<option value="${p.id}">${p.poNumber} R${p.revision} · ${p.supplier.name}</option>`).join('');$('po').onchange=loadPo;loadPo()}$('match').onclick=()=>{try{const po=selectedPo();currentInvoice=build();currentMatch=MIRSupplierInvoices.matchInvoice(currentInvoice,po,invReg());show()}catch(e){$('issues').innerHTML=`<div class="bad">${e.message}</div>`}};$('approve').onclick=()=>{try{if(!currentInvoice||!currentMatch)throw Error('Rapprocher la facture avant approbation.');const exceptions=currentMatch.reviewIssues.map(i=>{const reason=prompt(`Exception requise pour ${i.id}: ${i.message}`)||'';return{issueId:i.id,reason}});currentInvoice=MIRSupplierInvoices.approveForAccounting(currentInvoice,currentMatch,{approvedBy:$('approvedBy').value,exceptions});const r=MIRSupplierInvoices.upsertInvoice(invReg(),currentInvoice);localStorage.setItem(INVKEY,MIRSupplierInvoices.serialize(r));show()}catch(e){$('issues').innerHTML=`<div class="bad">${e.message}</div>`}};init();
</script></body></html>
