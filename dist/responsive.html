<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Responsive Atelier · MIR</title>
</head>
<body>
  <p role="status">Chargement du véritable écran MIR…</p>
  <script type="module">
    const pages = new Set(['index.html','boutique.html','produit.html','selection.html','pliage.html','production.html','chantier.html','entrepot.html','coordination.html','calepinage.html','plan.html','realisations.html','contact.html','materiaux.html']);
    try {
      const page = new URL(location.href).searchParams.get('page') || 'index.html';
      if (!pages.has(page)) throw new Error('Cette page ne fait pas partie des écrans MIR annotables.');
      const source = new URL(page, location.href);
      const response = await fetch(source, {credentials:'same-origin',cache:'no-store'});
      if (!response.ok) throw new Error('Écran MIR indisponible : HTTP ' + response.status);
      const html = await response.text();
      const parsed = new DOMParser().parseFromString(html, 'text/html');
      parsed.querySelectorAll('meta[name="robots"]').forEach(node => node.remove());
      const robots = parsed.createElement('meta');
      robots.name = 'robots';
      robots.content = 'noindex,nofollow';
      parsed.head.append(robots);
      parsed.querySelectorAll('base').forEach(node => node.remove());
      const base = parsed.createElement('base');
      base.href = new URL('./', location.href).href;
      parsed.head.prepend(base);
      parsed.documentElement.dataset.mirResponsiveEntry = 'true';
      const historyAdapter = parsed.createElement('script');
      historyAdapter.src = new URL('mir-responsive-history.js', base.href).href;
      parsed.head.insertBefore(historyAdapter, base.nextSibling);
      const adapter = parsed.createElement('script');
      adapter.type = 'module';
      adapter.src = new URL('mir-responsive-adapter.mjs', base.href).href;
      parsed.body.append(adapter);
      // The same-origin allowlisted page and its original scripts remain in the
      // main document. No iframe, copied business logic, or simulated buttons.
      document.open();
      document.write('<!doctype html>' + parsed.documentElement.outerHTML);
      document.close();
    } catch (error) {
      document.querySelector('[role="status"]').textContent = error.message;
    }
  </script>
</body>
</html>
