<!doctype html>
<html lang="fr-CA" data-mir-responsive-entry="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Responsive Atelier · MIR</title>
  <style>html,body{margin:0;min-height:100%;background:#f5f5f5}#mir-responsive-loading{padding:20px;font:14px/1.5 system-ui;color:#333}</style>
</head>
<body>
  <p id="mir-responsive-loading" role="status">Ouverture des vrais écrans MIR dans Responsive Atelier…</p>
  <script type="module">
    import {mountMirResponsive} from './mir-responsive-adapter.mjs';
    try {
      await mountMirResponsive();
    } catch(error) {
      let status=document.querySelector('#mir-responsive-loading');
      if(!status){status=document.createElement('p');status.id='mir-responsive-loading';document.body.prepend(status);}
      status.setAttribute('role','alert');status.textContent=error.message;
    }
  </script>
</body>
</html>
