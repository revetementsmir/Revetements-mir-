<!doctype html>
<html lang="fr-CA" data-mir-studio-public-state="construction">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#19221d">
<meta name="description" content="Le Studio MIR est en construction. Découvrez le reste du site et notre boutique.">
<title>Studio MIR — En construction</title>
<style>
:root{color-scheme:light;--ink:#19251e;--green:#477d34;--soft:#f4f5ef;--line:#d8dfd3;--muted:#59675a;font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-width:0}body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--soft);color:var(--ink)}a{color:inherit}a:focus-visible,button:focus-visible{outline:3px solid #237a28;outline-offset:4px}.skip{position:absolute;top:-90px;left:12px;background:#fff;padding:10px 15px;z-index:2}.skip:focus{top:12px}.site-header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:16px clamp(18px,5vw,72px);min-height:84px;border-bottom:1px solid var(--line);background:#fff}.brand{display:inline-flex;align-items:center;min-height:48px}.brand img{display:block;width:clamp(145px,17vw,195px);max-width:100%;height:auto}.header-actions{display:flex;align-items:center;gap:clamp(12px,2vw,25px);flex-wrap:wrap}.site-link{text-decoration:none;font-size:.91rem;font-weight:650}.site-link:hover{text-decoration:underline}.languages{display:flex;gap:3px;border:1px solid var(--line);border-radius:100px;padding:4px;background:#fff}.languages button{font:700 .81rem system-ui,sans-serif;min-width:45px;min-height:40px;border:0;border-radius:100px;background:transparent;color:var(--muted);cursor:pointer}.languages button[aria-pressed="true"]{background:var(--ink);color:#fff}
main{flex:1;display:grid;place-items:center;padding:30px 18px 44px}.construction{width:min(100%,780px);text-align:center}.eyebrow{margin:0;color:var(--green);font-weight:800;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase}.art{width:min(94%,450px);margin:3px auto 7px;display:block;overflow:visible}.art .hammer{transform-origin:328px 80px;animation:hammer-strike 2.8s ease-in-out infinite}.art .plank-one{animation:board-one 2.8s ease-out infinite}.art .plank-two{animation:board-two 2.8s ease-out infinite}.art .plank-three{animation:board-three 2.8s ease-out infinite}@keyframes hammer-strike{0%,15%,85%,100%{transform:rotate(-17deg)}37%,45%{transform:rotate(12deg)}60%{transform:rotate(-7deg)}}@keyframes board-one{0%,15%{opacity:0;transform:translateY(12px)}34%,100%{opacity:1;transform:translateY(0)}}@keyframes board-two{0%,34%{opacity:0;transform:translateY(12px)}52%,100%{opacity:1;transform:translateY(0)}}@keyframes board-three{0%,53%{opacity:0;transform:translateY(12px)}73%,100%{opacity:1;transform:translateY(0)}}h1{font-size:clamp(2.1rem,5.2vw,3.75rem);font-weight:800;line-height:1.13;letter-spacing:-.042em;margin:2px auto 13px;max-width:790px;text-wrap:balance}.soon{font-size:clamp(1.12rem,2vw,1.35rem);font-weight:750;color:var(--green);margin:0}.description{max-width:540px;margin:13px auto 27px;color:var(--muted);font-size:1rem}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.action{display:inline-flex;min-height:51px;align-items:center;justify-content:center;padding:12px 22px;border:1px solid var(--ink);border-radius:9px;text-decoration:none;font-size:.97rem;font-weight:750;transition:transform .15s ease,background .15s ease}.action:hover{transform:translateY(-2px)}.action.primary{background:var(--ink);color:#fff}.action.secondary{background:#fff;color:var(--ink)}footer{font-size:.79rem;text-align:center;border-top:1px solid var(--line);color:var(--muted);padding:17px 18px}
@media(max-width:420px){.site-header{padding:12px 16px;gap:7px}.brand img{width:139px}.header-actions{gap:8px}.site-link{font-size:.84rem}.languages{padding:2px}.languages button{min-height:42px;min-width:42px}.art{width:min(100%,340px);margin-top:4px}main{padding:17px 16px 30px}.description{margin-bottom:21px}.action{width:100%}.actions{gap:9px}}
@media(prefers-reduced-motion:reduce){.art .hammer,.art .plank-one,.art .plank-two,.art .plank-three{animation:none!important}.action{transition:none}.action:hover{transform:none}}
</style>
</head>
<body>
<a href="#contenu" class="skip" data-fr="Aller au contenu" data-en="Skip to content">Aller au contenu</a>
<header class="site-header" data-mir-public-shell>
<a class="brand" href="index.html" aria-label="Les Revêtements MIR — accueil"><img src="assets/MIR-logo-officiel-original.svg" alt="Les Revêtements MIR" width="364" height="91"></a>
<div class="header-actions"><a class="site-link" href="index.html" data-fr="Accueil" data-en="Home">Accueil</a><a class="site-link" href="boutique.html" data-fr="Boutique" data-en="Shop">Boutique</a><div class="languages" role="group" aria-label="Langue du site client"><button type="button" lang="fr-CA" data-mir-locale="fr-CA" aria-pressed="true">FR</button><button type="button" lang="en-CA" data-mir-locale="en-CA" aria-pressed="false">EN</button></div></div>
</header>
<main id="contenu"><section class="construction" aria-labelledby="construction-title"><p class="eyebrow">Studio MIR</p>
<svg class="art" viewBox="0 0 480 250" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><ellipse cx="240" cy="226" rx="150" ry="9" fill="#dce4d7"/><path d="M126 219V115l114-61 114 61v104" fill="none" stroke="#9cad9b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M117 124 240 57l123 67" fill="none" stroke="#477d34" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><g fill="#e7eee2" stroke="#477d34" stroke-width="3"><rect class="plank-one" x="151" y="180" width="178" height="33" rx="5"/><rect class="plank-two" x="151" y="144" width="178" height="32" rx="5"/><rect class="plank-three" x="151" y="108" width="178" height="32" rx="5"/></g><path d="M240 91v122" stroke="#aac0a5" stroke-width="5" stroke-dasharray="7 8"/><g class="hammer"><path d="M328 80 294 143" fill="none" stroke="#97724b" stroke-width="12" stroke-linecap="round"/><path d="m296 74 18-19 45 23-10 22-17-9-14 3" fill="#27392b"/><path d="m299 72-16 4-8 14" fill="none" stroke="#27392b" stroke-width="7" stroke-linecap="round"/></g><path d="m377 160 10-12m-21 6 1-16m19 30 14 2" fill="none" stroke="#79a160" stroke-width="4" stroke-linecap="round"/></svg>
<h1 id="construction-title" data-fr="En construction par l’équipe MIR" data-en="Under construction by the MIR team">En construction par l’équipe MIR</h1>
<p class="soon" data-fr="Ouverture bientôt" data-en="Opening soon">Ouverture bientôt</p>
<p class="description" data-fr="Le Studio se prépare. En attendant, explorez nos réalisations et nos matériaux sans quitter le site MIR." data-en="Our Studio is being prepared. In the meantime, explore our projects and materials on the MIR website.">Le Studio se prépare. En attendant, explorez nos réalisations et nos matériaux sans quitter le site MIR.</p>
<nav class="actions" aria-label="Navigation du Studio"><a class="action primary" href="index.html" data-fr="Retour au site" data-en="Back to the website">Retour au site</a><a class="action secondary" href="boutique.html" data-fr="Voir la boutique" data-en="Browse the shop">Voir la boutique</a></nav>
</section></main>
<footer>Les Revêtements MIR · Québec</footer>
<script>
(()=>{'use strict';const KEY='mir-client-locale-v1';const buttons=[...document.querySelectorAll('[data-mir-locale]')];function render(lang){if(lang!=='en-CA')lang='fr-CA';document.documentElement.lang=lang;document.title=lang==='en-CA'?'MIR Studio — Under construction':'Studio MIR — En construction';document.querySelector('meta[name="description"]').content=lang==='en-CA'?'The MIR Studio is under construction. Browse our website and shop.':'Le Studio MIR est en construction. Découvrez le reste du site et notre boutique.';document.querySelectorAll('[data-fr][data-en]').forEach(el=>{el.textContent=el.dataset[lang==='en-CA'?'en':'fr'];});const group=document.querySelector('.languages');group.setAttribute('aria-label',lang==='en-CA'?'Client website language':'Langue du site client');buttons.forEach(b=>{const on=b.dataset.mirLocale===lang;b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',b.lang==='en-CA'?(on?'English (Canada), selected':'Anglais canadien'):(on?'Français canadien, sélectionné':'French (Canada)'));});}let chosen='fr-CA';try{chosen=localStorage.getItem(KEY)==='en-CA'?'en-CA':'fr-CA';}catch{}render(chosen);buttons.forEach(button=>button.addEventListener('click',()=>{const next=button.dataset.mirLocale;try{localStorage.setItem(KEY,next);}catch{}render(next);}));addEventListener('storage',event=>{if(event.key===KEY)render(event.newValue);});})();
</script>
</body></html>
